<body><main><h1>표정 바꾼 그림 4장 · 인자하고 기품 있게</h1><p>입 다문 은은한 미소, 부드럽게 뜬 갈색 눈. 영상 만들기 전 그림이에요.</p><div class="box"><img src="s/Q1.jpg?v=4"><p class="say">“운명을 펼치기 전에, 먼저 이름부터 알려줄래요?”</p></div><p class="cap">Q1 · 도입</p><div class="box"><img src="s/Q5.jpg?v=4"><p class="say">“좋아요, 몇 가지만 더 물어볼게요! 혹시 지금 만나는 분이 계세요?”</p></div><p class="cap">Q5 · 연애</p><div class="box"><img src="s/Q8.jpg?v=4"><p class="say">“특별히 물어보실 내용이 있다면 따로 풀이를 작성해 드릴게요.”</p></div><p class="cap">Q8 · 따로 물을 것</p><div class="box"><img src="s/Q9.jpg?v=4"><p class="say">“자, 이제 마지막이에요! 제비 하나만 뽑아주시겠어요?”</p></div><p class="cap">Q9 · 마지막</p></main></body></html>
