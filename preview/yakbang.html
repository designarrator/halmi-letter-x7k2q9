<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>약방 할미 시험</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>@font-face{font-family:"GB";src:url("https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_one@1.0/GyeonggiBatang.woff") format("woff")}
body{margin:0;background:#15110d;color:#eee;font-family:"Pretendard Variable",sans-serif}main{max-width:448px;margin:0 auto;padding:16px 0 64px}
h1{font-size:18px;margin:8px 16px}p.n{font-size:14px;line-height:22px;color:#aaa;margin:4px 16px 24px}
.pn{position:relative;margin:0 0 64px}.pn img{display:block;width:100%}
.bb{position:absolute;background:#fff;color:#1d1d1d;border:1.5px solid #3a3a3a;border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;font-size:16px;line-height:24px;padding:22px 20px;aspect-ratio:1.15/1;box-sizing:border-box}
.bb b{color:#B0473A}
.cap{text-align:center;font-family:"GB",serif;font-size:21px;line-height:34px;color:#e9dcc6;padding:8px 24px 48px}.cap em{font-style:normal;color:#E0705E}</style></head>
<body><main><h1>약방 할미 시험 2 · 맑은 눈의 T 할미</h1><p class="n">배경은 밤의 약방, 표정은 맑은 눈과 은은한 미소 그대로, 말은 직설. 진맥 → 짚음 → 약 짓기.</p>
<div class="pn"><img src="yak/Y0.jpg?v=2"><div class="bb" style="left:46%;top:62%;width:50%"><span>왔구나. 앉아라.<br><b>말 안 해도 된다.</b></span></div></div>
<div class="pn"><img src="yak/Y1.jpg?v=2"><div class="bb" style="left:4%;top:-14%;width:48%"><span>손 내밀어라.</span></div><div class="bb" style="left:48%;top:60%;width:50%"><span>…맥이 차다.<br><b>겨울에 났구나.</b></span></div></div>
<p class="cap">겉으론 꿋꿋한데,<br><em>속은 벌써 지쳐 있다.</em></p>
<div class="pn"><img src="yak/Y2.jpg?v=2"><div class="bb" style="left:48%;top:66%;width:50%"><span>듣고 싶은 말은<br>안 한다.<br><b>필요한 말만 한다.</b></span></div></div>
<div class="pn"><img src="yak/Y3.jpg?v=2"><div class="bb" style="left:4%;top:-16%;width:54%"><span>2027년에 네가<br>다칠 곳, <b>세 군데</b>다.</span></div><div class="bb" style="left:52%;top:62%;width:46%"><span>약은<br>하나씩 지어 주마.</span></div></div>
</main></body></html>
