<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>[v2] 할미약방 · 2027 정미년</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Hahmlet:wght@700;900&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/moonspam/NanumBarunGothic@1.0/nanumbarungothicsubset.css" rel="stylesheet">
<style>
/* 할미약방 v1 (11/23) — 정본: personal-vault/projects/사주 할미/17 할미약방 전체 흐름.md
   입력(S1~S8, 한 화면씩) → 결과(R1~R17, 내려 읽기, 하단 고정 버튼) → 결제(P1) → 약 달이기(P2).
   손으로 하는 것 6가지: 맥 짚기(S6) · 약재 저울(R3) · 약연 긁기(R5) · 서랍 세 칸(R7) · 약첩 끈 묶기(R16) · 부채질(P2). */
/* 글꼴 체계(청월당 월하소녀와 같은 역할로): 대사·제목 KoPubWorld 바탕(청월당과 같은 글꼴), 큰 제목·이름 Hahmlet(청월당 글자 그림·산돌 상록수 대신 무료 굵은 명조), 쪽지 손글씨 Nanum Pen(산돌 공병각필 대신), 웹툰 말풍선 나눔바른고딕(같은 글꼴), 버튼·본문 Pretendard(같은 글꼴) */
@font-face{font-family:"KyoboHand";src:url("https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2112@1.0/KyoboHandwriting2020A.woff") format("woff");font-display:swap}
@font-face{font-family:"KoPub";src:url("fonts/KoPubWorldBatang-Medium.woff2") format("woff2");font-weight:400 500;font-display:swap}
@font-face{font-family:"KoPub";src:url("fonts/KoPubWorldBatang-Bold.woff2") format("woff2");font-weight:600 800;font-display:swap}
@font-face{font-family:"HSB";src:url("fonts/GapyeongHanseokbong.woff2") format("woff2");font-display:swap}
:root{--ink:#2B2219;--ink2:#6B5A49;--ink3:#A0907D;--paper:#F7EFE2;--card:#FFFBF4;--wood:#5A3A24;--amber:#E9A94B;--red:#B8402F;--redS:#F6E1DA;--navy:#2E4A62;--line:#E8DCC8;--serif:"KoPub","Noto Serif KR",serif;--title:"Hahmlet","KoPub",serif;--bubble:"NanumBarunGothic","Pretendard Variable",sans-serif;--sans:"Pretendard Variable",Pretendard,-apple-system,sans-serif;--brush:"HSB","GB",serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);word-break:keep-all}
p{margin:0}
button{font:inherit;cursor:pointer;padding:0}
input[type=checkbox]{margin:0}
#app{max-width:448px;margin:0 auto;background:var(--paper);min-height:100vh;position:relative;overflow:hidden}
.ex{display:inline-block;font-family:var(--sans);font-size:11px;line-height:14px;color:var(--red);border:1px solid var(--red);border-radius:6px;padding:0 5px;margin-left:4px;vertical-align:middle;font-weight:400}

/* ── 입력 화면(한 화면씩) ── */
body.noscroll{overflow:hidden;position:fixed;inset:0;width:100%}
.sc{position:relative;height:100vh;height:100dvh;display:flex;flex-direction:column;background:var(--paper);animation:fade .45s ease-out;overflow:hidden}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sc .pic{position:absolute;inset:0;overflow:hidden}
.sc.form-sc .pic::after{background:linear-gradient(rgba(247,239,226,0) 22%,rgba(247,239,226,.9) 34%,var(--paper) 40%)}
.sc .pic img{display:block;width:100%;height:100%;object-fit:cover;object-position:center top;animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{from{transform:scale(1.02)}to{transform:scale(1.08) translateY(-1.5%)}}
.sc .pic::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(247,239,226,0) 48%,rgba(247,239,226,.88) 62%,var(--paper) 70%)}
.sc .low{position:absolute;left:0;right:0;bottom:0;padding:0 20px calc(112px + env(safe-area-inset-bottom))}
.sc.form-sc .low{top:36%;bottom:auto}
.sc.split .pic{position:relative;inset:auto;flex:0 0 62%}
.sc.split .pic::after{background:linear-gradient(rgba(247,239,226,0) 80%,var(--paper))}
.sc.split .low{position:relative;flex:1 1 auto}
.says{min-height:72px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;transition:opacity .35s ease}
.says.dim{opacity:0}
.say{font-family:var(--serif);font-weight:400;font-size:17px;line-height:27px;color:var(--ink);text-align:center}
.hint{font-size:13px;line-height:19px;color:var(--ink3);text-align:center;margin-top:8px}
.bot{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:12px 20px calc(16px + env(safe-area-inset-bottom));background:linear-gradient(rgba(247,239,226,0),var(--paper) 30%)}
.bot>div{max-width:448px;margin:0 auto}
.btn{width:100%;height:56px;border:0;border-radius:16px;background:var(--wood);color:#FFF4E2;font-size:17px;font-weight:600;box-shadow:0 2px 0 #3a2416}
.btn:disabled{opacity:.35}
.lnk{display:block;width:100%;background:none;border:0;color:var(--ink2);text-decoration:underline;text-underline-offset:3px;font-size:15px;line-height:24px;margin-top:8px;height:44px}
/* 첫 화면 */

.s1 .pic::after{background:linear-gradient(rgba(8,14,34,.55),rgba(8,14,34,0) 45%,rgba(8,14,34,.45))}
.s1 .tt{position:absolute;z-index:2;left:20px;right:20px;top:88px;text-align:center;color:#FFF7E6;text-shadow:0 2px 12px rgba(0,0,0,.55)}
.s1 .tt .y{font-family:var(--serif);font-weight:400;font-size:17px;line-height:27px;letter-spacing:2px}
.s1 .tt h1{font-family:var(--title);font-weight:900;font-size:64px;line-height:76px;margin:8px 0;letter-spacing:4px}
.s1 .tt .a{font-family:var(--serif);font-weight:400;font-size:20px;line-height:30px}
.s1 .tt .b{font-family:var(--serif);font-weight:400;font-size:15px;line-height:24px;opacity:.9;margin-top:8px}
.snow{position:absolute;inset:0;z-index:1;pointer-events:none}
.snow i{position:absolute;top:-10px;width:5px;height:5px;border-radius:50%;background:#fff;opacity:.75;animation:fall linear infinite}
@keyframes fall{to{transform:translate(18px,105vh)}}
/* 입력칸 */
.slip{display:block;width:100%;min-height:120px;margin-top:16px;border:1px solid var(--line);border-radius:16px;background:#FFFDF7;padding:16px;font-family:"Nanum Pen Script",cursive;font-size:26px;line-height:32px;color:#2a2520;resize:none}
.slip::placeholder{color:#c4b6a3}
.form{margin-top:16px;display:grid;gap:12px}
.form label{display:block;font-size:13px;line-height:19px;color:var(--ink2);margin-bottom:4px}
.form input{width:100%;height:48px;border:1px solid var(--line);border-radius:16px;background:#FFFDF7;padding:0 16px;font-size:17px;color:var(--ink)}
.seg{display:flex;gap:8px}
.seg button{flex:1;height:44px;border-radius:999px;border:1px solid var(--line);background:#FFFDF7;color:var(--ink2);font-size:15px}
.seg button.on{background:var(--wood);color:#FFF4E2;border-color:var(--wood)}
.row2{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.chk{font-size:13px;color:var(--ink2);display:flex;gap:8px;align-items:center;white-space:nowrap}
.err{font-size:13px;line-height:19px;color:var(--red);min-height:19px}
.sent{margin-top:16px;font-family:var(--serif);font-size:17px;line-height:27px;color:var(--ink2);text-align:center}
.sent select{font-family:var(--sans);font-size:17px;height:40px;border-radius:999px;border:1px solid var(--line);background:#FFFDF7;color:var(--ink);padding:0 8px;margin:0 4px}
/* 맥 짚기 */
.pulse-zone{position:absolute;z-index:3;left:50%;top:74%;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;touch-action:none}
.pulse-zone::before,.pulse-zone::after{content:"";position:absolute;inset:30px;border-radius:50%;border:2px solid rgba(255,230,190,.9);animation:ring 1.1s ease-out infinite}
.pulse-zone::after{animation-delay:.55s}
@keyframes ring{from{transform:scale(.6);opacity:1}to{transform:scale(1.6);opacity:0}}
.pulse-zone.hold::before,.pulse-zone.hold::after{border-color:#ff9a7a;animation-duration:.8s}
.pulse-zone b{position:absolute;inset:44px;border-radius:50%;background:rgba(255,240,220,.85)}
.prog{height:8px;border-radius:999px;background:var(--line);overflow:hidden;margin:16px 0 4px}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--amber),var(--red));transition:width .15s linear}
.steam{text-align:center;font-size:13px;line-height:19px;color:var(--ink3)}
/* 표지 */
.cover{position:relative;height:100vh;overflow:hidden}
.cover img{width:100%;height:100%;object-fit:cover}
.cover::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 55%,rgba(20,12,6,.55),rgba(20,12,6,.15) 70%)}
.cover .ct{position:absolute;z-index:2;inset:0;padding:0 20px 120px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#FFF7E6;text-shadow:0 2px 16px rgba(0,0,0,.6);text-align:center}
.cover .ey{font-family:var(--serif);font-size:15px;line-height:24px;letter-spacing:0}
.cover .nm{font-family:var(--title);font-weight:900;font-size:64px;line-height:76px;margin:12px 0 16px;letter-spacing:0}
.cover .ln{font-family:var(--serif);font-size:20px;line-height:30px}
.cover .down{margin-top:32px;font-size:13px;line-height:19px;opacity:.8;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(6px)}}

/* ── 결과(웹툰) ── */
.res{background:#fff;padding-bottom:150px}
.wt{padding:28px 0 12px}
.pn{position:relative;margin:0 0 56px}
.pn .im{display:block;width:100%;height:var(--h,420px);object-fit:cover;object-position:var(--p,center)}
.pn.box{margin-left:28px;margin-right:28px}.pn.box .im{border:2px solid #1d1d1d}
.pn.boxL{margin-left:16px;margin-right:84px}.pn.boxL .im{border:2px solid #1d1d1d}
.pn.boxR{margin-left:84px;margin-right:16px}.pn.boxR .im{border:2px solid #1d1d1d}
.pn.tilt .im{clip-path:polygon(0 6%,100% 0,100% 94%,0 100%)}
.pn.full .im{-webkit-mask-image:linear-gradient(#000 92%,transparent);mask-image:linear-gradient(#000 92%,transparent)}
.bb{position:absolute;aspect-ratio:auto!important;min-height:0;padding:28px 26px!important;z-index:3;background:#fff;border:1.5px solid #3a3a3a;border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:var(--bubble);font-size:16px;line-height:24px;color:#1d1d1d;padding:22px 18px;aspect-ratio:1.15/1;opacity:0;transform:scale(.6);transition:opacity .25s,transform .35s cubic-bezier(.3,1.6,.5,1)}
.bb.in{opacity:1;transform:scale(1)}
.bb b{color:var(--red)}
.sfx{position:absolute;z-index:3;font-family:var(--serif);font-weight:700;font-size:28px;color:#1d1d1d;-webkit-text-stroke:5px #fff;paint-order:stroke;opacity:0;transition:opacity .2s .3s}
.sfx.in{opacity:1}
.cap{text-align:center;font-family:var(--serif);font-size:21px;line-height:34px;color:#4a4038;padding:16px 26px 40px}
.cap em{font-style:normal;color:var(--red)}
.cap small{display:block;font-family:var(--sans);font-size:13px;line-height:20px;color:#999;margin-top:8px}
/* 쪽지·맥 기록지 */
.wish .wt2{font-family:"KyoboHand",cursive!important;position:absolute;z-index:2;left:22%;right:22%;top:30%;height:40%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:"Nanum Pen Script",cursive;font-size:29px;line-height:34px;color:#2a2520;mix-blend-mode:multiply;transform:rotate(-1.5deg)}
.wish .ring{position:absolute;z-index:3;left:8%;width:84%;top:20%;height:60%;overflow:visible;mix-blend-mode:multiply}
.wish .ring path{fill:none;stroke:#C8352A;stroke-width:9;stroke-linecap:round;opacity:.85;stroke-dasharray:1;stroke-dashoffset:1}
.wish.in .ring path{animation:draw 1.1s .3s cubic-bezier(.5,0,.3,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.ms .grid{position:absolute;z-index:2;left:15%;right:15%;top:22%;bottom:22%;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:10px 8px;background:linear-gradient(160deg,#F8EBCF,#F1DDB6);border:1px solid #D8BF92;border-radius:3px;box-shadow:0 6px 14px rgba(90,50,20,.28);transform:rotate(-1.2deg)}
.ms .grid::before{content:"";position:absolute;inset:5px;border:1.5px solid rgba(178,60,46,.55);pointer-events:none}
.ms .grid div{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:space-around;font-family:var(--serif);border-left:1px solid rgba(178,60,46,.35)}
.ms .grid div:first-child{border-left:0}
.ms .grid small{font-size:12px;color:#7a5a4a}
.ms .grid b{font-size:30px;line-height:34px;color:#2a201a}
.ms .grid i{font-style:normal;font-size:11px;line-height:15px;color:#fff;border-radius:8px;padding:0 6px;margin-top:-8px}
.ms .grid div.me{background:rgba(192,57,43,.16);border-radius:4px;box-shadow:inset 0 0 0 1.5px rgba(192,57,43,.7)}
.soul{position:relative;margin:0 0 40px}
.soul img{display:block;width:100%;height:300px;object-fit:cover}
.soul p{position:absolute;left:0;right:0;bottom:12%;text-align:center;font-family:var(--serif);font-size:20px;line-height:32px;color:#fff;text-shadow:0 2px 10px rgba(10,20,45,.75)}
/* 블록 */
.blk{position:relative;margin:8px 16px 48px;background:linear-gradient(rgba(255,250,240,.55),rgba(255,250,240,.55)),url(img/ui/hanji.jpg) center/cover;border:1px solid #E2CFA6;border-radius:20px;padding:28px 20px;box-shadow:0 4px 12px rgba(90,60,30,.12)}
.blk .ey{font-family:var(--serif);font-size:15px;color:var(--ink2);text-align:center}
.blk .tt{font-family:var(--serif);font-size:24px;line-height:34px;color:var(--wood);text-align:center;margin:4px 0 16px}
.blk .dv{width:120px;height:1px;background:var(--line);margin:0 auto 18px}
.ask{font-family:var(--serif);font-size:16px;line-height:26px;color:var(--ink2);text-align:center;margin-bottom:12px}
/* 저울 */
.scale .stage{position:relative;border-radius:16px;overflow:hidden;border:2px solid #1d1d1d}
.scale .stage>img.bg{display:block;width:100%;aspect-ratio:1/1;object-fit:cover}
.scale .drop{position:absolute;width:22%;aspect-ratio:1/1;border-radius:50%;object-fit:cover;box-shadow:0 4px 10px rgba(0,0,0,.35);transition:all .55s cubic-bezier(.3,1.3,.5,1);opacity:0}
.scale .drop.in{opacity:1}
.scale .bub{position:absolute;right:4%;top:4%;width:52%;background:#fff;border:1.5px solid #3a3a3a;border-radius:50%;aspect-ratio:1.4/1;display:flex;align-items:center;justify-content:center;text-align:center;font-family:var(--bubble);font-size:15px;line-height:22px;padding:12px;opacity:0;transform:scale(.6);transition:all .3s}
.scale .bub.in{opacity:1;transform:scale(1)}.scale .bub b{color:var(--red)}
.tokens{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:16px}
.tokens button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:var(--serif);font-size:15px;line-height:24px;color:var(--ink)}
.tokens button img{width:100%;aspect-ratio:1/1;border-radius:50%;object-fit:cover;border:2px solid #C9A25B;box-shadow:0 2px 6px rgba(90,60,30,.2);transition:transform .2s,opacity .3s}
.tokens button.on img{opacity:.35;transform:scale(.9)}
.wres{margin-top:16px;display:grid;gap:8px}
.wres div{display:grid;grid-template-columns:32px 44px 1fr auto;gap:8px;align-items:center;font-family:var(--serif);font-size:15px;line-height:24px;color:var(--ink)}
.wres img{width:32px;height:32px;border-radius:50%;object-fit:cover}
.wres .dots i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:4px;background:#E2D3B8}
.wres .dots i.f{background:#7A4A2C}
.wres em{font-style:normal;font-size:13px;line-height:19px;color:var(--ink2)}
.wres em.hi{color:var(--red);font-weight:600}
.wres b{text-align:right;font-variant-numeric:tabular-nums}
/* 약연 긁기 */
.grind{position:relative;border-radius:16px;overflow:hidden;margin-top:6px}
.grind canvas{position:absolute;inset:0;width:100%;height:100%;z-index:2;touch-action:none;transition:opacity .6s}
.gradeCard{padding:32px 16px;text-align:center;background:linear-gradient(rgba(255,250,240,.45),rgba(255,250,240,.45)),url(img/ui/hanji.jpg) center/cover}
.gradeCard .g{font-family:var(--title);font-weight:900;font-size:56px;line-height:66px;color:var(--red)}
.gradeCard .l{font-family:var(--serif);font-size:18px;line-height:28px;color:var(--ink);margin-top:4px}
.grades{display:flex;gap:4px;justify-content:center;margin:14px 0 4px;flex-wrap:wrap}
.grades span{font-size:12px;padding:3px 8px;border-radius:12px;background:#EFE6D7;color:#8a7a68}
.grades span.on{background:var(--wood);color:#fff}
.area{display:grid;grid-template-columns:90px 1fr;gap:8px 12px;margin-top:16px;font-size:15px;color:#6b5a49}
.area .low{color:var(--red);font-weight:600}
.moons i{display:inline-block;width:15px;height:15px;border-radius:50%;background:#E3B85A;margin-right:4px}.moons i.e{background:#EAE0CF}
/* 탈 카드 */
.tal{border:1px solid var(--line);border-radius:16px;padding:16px;background:#fff;margin-top:12px}
.tal h4{margin:0 0 10px;font-family:var(--serif);font-size:19px;color:var(--wood)}
.tal .r{display:grid;grid-template-columns:78px 1fr;gap:8px;font-size:15px;line-height:23px;padding:5px 0;border-top:1px dashed #eee}
.tal .r:first-of-type{border-top:0}
.tal .r b{font-size:12px;line-height:22px;color:#fff;background:#8a6a4e;border-radius:6px;text-align:center;height:22px}
.tal .r b.w{background:var(--red)}.tal .r b.g{background:#3e7a5e}
.lock{position:relative;margin-top:14px;border-radius:14px;background:#F4EDE2;padding:18px}
.lock h5{margin:0 0 10px;font-size:15px;text-align:center;color:var(--wood)}
.lock li{list-style:none;font-size:15px;line-height:24px;padding:3px 0;color:#4a3f35}
.lock li::before{content:"✓";display:inline-block;width:17px;height:17px;border-radius:50%;background:#C9A25B;color:#fff;font-size:11px;line-height:17px;text-align:center;margin-right:8px}
.lock ul{margin:0;padding:0}
.blur{filter:blur(5px);user-select:none}
/* 서랍 */
.drawers{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px;border-radius:12px;background:#6B4329;box-shadow:inset 0 0 0 3px #4d2f1d}
.drawers button{position:relative;height:74px;border:0;border-radius:6px;background:linear-gradient(#9A6A45,#85583A);box-shadow:inset 0 0 0 2px #5e3b25;color:#FFEFD6;transition:transform .3s}
.drawers button::after{content:"";position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px;border-radius:50%;border:3px solid #D9B464}
.drawers button.open{transform:translateY(-4px) scale(1.04);background:#F6EAD3;box-shadow:inset 0 0 0 2px #C9A25B,0 6px 10px rgba(0,0,0,.3);color:var(--ink)}
.drawers button.open::after{display:none}
.drawers button span{font-family:var(--serif);font-size:16px;display:block}
.drawers button small{font-size:11px;line-height:14px;display:block;margin-top:2px}
.drawers button.bad small{color:var(--red)}.drawers button.good small{color:#3e7a5e}
.react{min-height:24px;margin-top:12px;font-family:var(--serif);font-size:16px;line-height:26px;text-align:center;color:var(--wood)}
/* 마음·몸·사람 */
.flowsvg{width:100%;height:auto}
.day{border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:10px;background:#fff}
.day h4{margin:0 0 6px;font-family:var(--serif);font-size:18px;color:#5a6f7d}
.day.bad h4{color:var(--red)}
.day p{font-size:15px;line-height:23px;color:#4a3f35}
.clip{border-radius:14px;background:#FAF4E6;border:1px solid #E7DCC2;padding:18px}
.clip h4{margin:0;font-family:var(--serif);font-size:18px;text-align:center}

<script>
const KEY = (location.hash.match(/k=([^&]+)/) || [])[1] || "";
const Q = new URLSearchParams(location.search);

const hasJ = (w) => { const c = w.charCodeAt(w.length - 1) - 0xac00; return c >= 0 && c % 28 > 0; };
const isBal = (v) => { const a = Object.values(v.pct); return Math.max(...a) < 30 && Math.min(...a) >= 10; };

const callName = (n) => { n = String(n || "").trim(); if (!/^[가-힣]+$/.test(n)) return n; if (n.length >= 4 && SUR2.includes(n.slice(0, 2))) return n.slice(2); if (n.length >= 3) return n.slice(1); return n; };
const EX = '<span class="ex">예시 값</span>';

const LS = { get: (k) => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }, set: (k, v) => localStorage.setItem(k, JSON.stringify(v)) };

/* 입력값 (데모: ?demo=1 이면 다혜 예시로 바로 결과) */
let U = LS.get("yak_user") || { wish: "", name: "", y: "", m: "", d: "", cal: "solar", hour: "", minute: "", known: true, gender: "f", love: "", loveLen: "" };
if (Q.get("demo")) U = { wish: "내년에 미국 발령이 날 것 같은데, 가도 괜찮을까요?", name: "다혜", y: 1999, m: 1, d: 22, cal: "solar", hour: 17, minute: 30, known: true, gender: "f", love: "연애중", loveLen: "1년 ~ 3년" };
if (Q.get("demo") && Q.get("wish") != null) { U.wish = Q.get("wish"); const b = (Q.get("b") || "").split("-"); if (b.length >= 3) Object.assign(U, { y: +b[0], m: +b[1], d: +b[2], hour: +(b[3] ?? 12), minute: 0, known: b[3] != null, love: Q.get("love") || "" }); if (Q.get("name")) U.name = Q.get("name"); } // 시험용

/* 말이 한 글자씩 */
async function typeTo(el, text, speed = 38) { el.textContent = ""; for (const ch of text) { el.textContent += ch; await sleep(ch === "…" || ch === "." ? speed * 5 : speed); } }

const splitS0 = (t) => t.match(/[^.?!]+(?:[.?!]+["”」]?|$)\s*/g).map((x) => x.trim()).filter(Boolean);

const splitS = (t) => splitS0(t).reduce((a, x) => { if (a.length && isShort(x)) a[a.length - 1] += " " + x; else a.push(x); return a; }, []);

function show(html, bot = "", lock = true) { document.body.classList.toggle("noscroll", lock); $("#app").innerHTML = html; $("#cta").classList.remove("on"); window.scrollTo(0, 0); const b = document.querySelector(".bot"); if (b) b.remove(); if (bot) document.body.insertAdjacentHTML("beforeend", `<div class="bot"><div>${bot}</div></div>`); }
const VIDS = new Set(["S3", "S4", "S5", "S6"]);
const media = (img, extra = "") => (VIDS.has(img) ? `<video class="mv" src="vid/${img}.mp4?v=3" poster="${IMG(img)}" autoplay muted loop playsinline ${extra}></video>` : `<img src="${IMG(img)}?v=3" alt="" ${extra}>`);

/* S2 문 열기 — 세 장면, 장면마다 움직이는 그림(8초 반복 영상)으로 바뀜 */

/* 달력 일정: 조심 날(계산값 days «7/12»), 볕 드는 달(1일), 다시 펴 볼 날(첫 조심 날 7일 전). 2월~12월은 2027년, 1월은 2028년 */
function calEvents(v) {
  const yOf = (m) => (m >= 2 ? 2027 : 2028), out = [];
  const SAY = ["오늘은 말을 아껴라. 하고 싶은 말은 내일 해도 늦지 않다.", "오늘은 큰 도장은 미뤄라.", "오늘은 일찍 들어가 쉬거라. 몸이 먼저다."];
  let k = 0;
  for (const c of v.caution || []) for (const ds of c.days || []) { const [m, d] = String(ds).split("/").map(Number); if (m && d) out.push({ y: yOf(m), m, d, t: `할미: ${SAY[k++ % SAY.length]}` }); }
  for (const i of v.chance || []) { const n = parseInt(String(v.flow[i]?.label || "").match(/(\d+)\s*월/)?.[1] || 0); if (n) out.push({ y: yOf(n), m: n, d: 1, t: "할미: 이달은 볕 드는 달이다. 미뤄 둔 일을 꺼내 보거라." }); }
  out.sort((a, b) => new Date(a.y, a.m - 1, a.d) - new Date(b.y, b.m - 1, b.d));
  const first = out.find((e) => /아껴라|미뤄라|쉬거라/.test(e.t));
  if (first) { const r = new Date(first.y, first.m - 1, first.d - 7); out.push({ y: r.getFullYear(), m: r.getMonth() + 1, d: r.getDate(), t: "할미: 편지를 다시 펴 볼 날이다. 다음 주가 조심할 때란다." }); }
  return out.sort((a, b) => new Date(a.y, a.m - 1, a.d) - new Date(b.y, b.m - 1, b.d));
}
function icsText(ev) {
  const p = (n) => String(n).padStart(2, "0"), ymd = (e, plus = 0) => { const t = new Date(e.y, e.m - 1, e.d + plus); return `${t.getFullYear()}${p(t.getMonth() + 1)}${p(t.getDate())}`; };
  const link = `${location.origin}${location.pathname}#k=${KEY}`, now = new Date().toISOString().replace(/[-:]/g, "").slice(0, 15) + "Z";
  const L = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//halmi-yakbang//KO", "CALSCALE:GREGORIAN", "X-WR-CALNAME:할미약방 2027"];
  ev.forEach((e, i) => L.push("BEGIN:VEVENT", `UID:halmi-${ymd(e)}-${i}@yakbang`, `DTSTAMP:${now}`, `DTSTART;VALUE=DATE:${ymd(e)}`, `DTEND;VALUE=DATE:${ymd(e, 1)}`, `SUMMARY:${e.t}`, `DESCRIPTION:할미 편지 다시 열기 ${link}`, "BEGIN:VALARM", "ACTION:DISPLAY", `DESCRIPTION:${e.t}`, "TRIGGER:PT9H", "END:VALARM", "END:VEVENT"));
  L.push("END:VCALENDAR");
  return L.join("\r\n");
}
/* 부적 배경화면: 1080×2340 캔버스에 내 글자 그림 + 채울 기운 + 이름 */
async function makeWallpaper(v, NAME) {
  const T = Object.fromEntries((v.table || []).map((c) => [c.label, c])), me = T["일"]?.gan || "", base = T["월"]?.zhi || "";
  const W = 1080, H = 2340, cv = document.createElement("canvas"); cv.width = W; cv.height = H; const g = cv.getContext("2d");
  const load = (src) => new Promise((r, j) => { const im = new Image(); im.onload = () => r(im); im.onerror = j; im.src = src; });
  await Promise.all([document.fonts.load('200px "HSB"'), document.fonts.load('600 60px "KoPub"'), document.fonts.load('40px "Pretendard Variable"')]).catch(() => {});
  g.fillStyle = "#F7EFE2"; g.fillRect(0, 0, W, H);
  const im = await load(`img/s/${encodeURIComponent(me + base)}.jpg`).catch(() => load("img/l/L1-7.jpg"));
  const ih = 1300, sc = Math.max(W / im.width, ih / im.height), dw = im.width * sc, dh = im.height * sc;
  g.save(); g.beginPath(); g.rect(0, 0, W, ih); g.clip(); g.drawImage(im, (W - dw) / 2, (ih - dh) / 2, dw, dh); g.restore();
  const gr = g.createLinearGradient(0, ih - 360, 0, ih); gr.addColorStop(0, "rgba(247,239,226,0)"); gr.addColorStop(1, "#F7EFE2"); g.fillStyle = gr; g.fillRect(0, ih - 360, W, 360);
  const u = v.useful[0], u2 = v.useful[1];
  g.textAlign = "center"; g.fillStyle = "#6B5A49"; g.font = '500 44px "KoPub", serif'; g.fillText("2027 丁未年, 무사히 지나가거라", W / 2, ih + 40);
  g.fillStyle = WXC[u]; g.font = '320px "HSB", serif'; g.fillText(u, W / 2, ih + 400);
  g.fillStyle = "#2B2219"; g.font = '600 64px "KoPub", serif'; g.fillText(`채울 기운 ${WXN[u]}`, W / 2, ih + 520);
  if (u2) { g.fillStyle = "#6B5A49"; g.font = '500 44px "KoPub", serif'; g.fillText(`곁들일 기운 ${WXN[u2]}`, W / 2, ih + 600); }
  [u, u2].filter(Boolean).forEach((e, i, a) => { g.fillStyle = WXC[e]; g.beginPath(); g.arc(W / 2 + (i - (a.length - 1) / 2) * 120, ih + 700, 40, 0, 7); g.fill(); });
  g.fillStyle = "#2B2219"; g.font = '600 56px "KoPub", serif'; g.fillText(`우리 ${NAME}${voc(NAME)}`, W / 2, ih + 860);
  g.save(); g.translate(W - 190, H - 250); g.rotate(-0.08); g.strokeStyle = "#B8402F"; g.lineWidth = 8; g.strokeRect(-70, -70, 140, 140); g.fillStyle = "#B8402F"; g.font = '64px "HSB", serif'; g.fillText("할미", 0, 22); g.restore();
  g.fillStyle = "#A0907D"; g.font = '36px "Pretendard Variable", sans-serif'; g.fillText("할미약방 부적", W / 2, H - 120);
  return cv.toDataURL("image/png");
}
