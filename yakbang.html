<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>할미약방 · 2027 정미년</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
/* 할미약방 v1 (11/23) — 정본: personal-vault/projects/사주 할미/17 할미약방 전체 흐름.md
   입력(S1~S8, 한 화면씩) → 결과(R1~R17, 내려 읽기, 하단 고정 버튼) → 결제(P1) → 약 달이기(P2).
   손으로 하는 것 6가지: 맥 짚기(S6) · 약재 저울(R3) · 약연 긁기(R5) · 서랍 세 칸(R7) · 약첩 끈 묶기(R16) · 부채질(P2). */
@font-face{font-family:"GB";src:url("https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_one@1.0/GyeonggiBatang.woff") format("woff");font-display:swap}
@font-face{font-family:"HSB";src:url("fonts/GapyeongHanseokbong.woff2") format("woff2");font-display:swap}
:root{--ink:#2B2219;--ink2:#6B5A49;--ink3:#A0907D;--paper:#F7EFE2;--card:#FFFBF4;--wood:#5A3A24;--amber:#E9A94B;--red:#B8402F;--redS:#F6E1DA;--navy:#2E4A62;--line:#E8DCC8;--serif:"GB",serif;--sans:"Pretendard Variable",Pretendard,-apple-system,sans-serif;--brush:"HSB","GB",serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#120D09;color:var(--ink);font-family:var(--sans);word-break:keep-all}
p{margin:0}
button{font:inherit;cursor:pointer}
#app{max-width:448px;margin:0 auto;background:var(--paper);min-height:100vh;position:relative;overflow:hidden}
.ex{display:inline-block;font-family:var(--sans);font-size:11px;line-height:14px;color:var(--red);border:1px solid var(--red);border-radius:6px;padding:0 5px;margin-left:4px;vertical-align:middle;font-weight:400}

/* ── 입력 화면(한 화면씩) ── */
.sc{position:relative;min-height:100vh;display:flex;flex-direction:column;background:#1b130d;animation:fade .45s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sc .pic{position:relative;height:60vh;min-height:420px;overflow:hidden}
.sc.form-sc .pic{height:40vh;min-height:300px}
.sc .pic img{width:100%;height:100%;object-fit:cover;object-position:center 30%;animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{from{transform:scale(1.02)}to{transform:scale(1.08) translateY(-1.5%)}}
.sc .pic::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,0) 55%,var(--paper))}
.sc .low{position:relative;flex:1;background:var(--paper);padding:0 22px 132px;margin-top:-1px}
.say{font-family:var(--serif);font-size:19px;line-height:31px;color:var(--ink);text-align:center;min-height:62px}
.say+.say{margin-top:10px}
.hint{font-size:13px;line-height:20px;color:var(--ink3);text-align:center;margin-top:8px}
.bot{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:12px 20px calc(16px + env(safe-area-inset-bottom));background:linear-gradient(rgba(247,239,226,0),var(--paper) 30%)}
.bot>div{max-width:448px;margin:0 auto}
.btn{width:100%;height:56px;border:0;border-radius:16px;background:var(--wood);color:#FFF4E2;font-size:17px;font-weight:600;box-shadow:0 2px 0 #3a2416}
.btn:disabled{opacity:.35}
.lnk{display:block;width:100%;background:none;border:0;color:var(--ink2);text-decoration:underline;font-size:14px;margin-top:8px;height:28px}
/* 첫 화면 */
.s1 .pic{height:100vh}
.s1 .pic::after{background:linear-gradient(rgba(8,14,34,.55),rgba(8,14,34,0) 45%,rgba(8,14,34,.5))}
.s1 .tt{position:absolute;z-index:2;left:0;right:0;top:11vh;text-align:center;color:#FFF7E6;text-shadow:0 2px 14px rgba(0,0,0,.6)}
.s1 .tt .y{font-family:var(--serif);font-size:17px;letter-spacing:2px}
.s1 .tt h1{font-family:var(--serif);font-size:56px;line-height:70px;margin:8px 0 6px;font-weight:700;letter-spacing:4px}
.s1 .tt .a{font-family:var(--serif);font-size:22px;line-height:32px}
.s1 .tt .b{font-family:var(--serif);font-size:15px;line-height:24px;opacity:.85;margin-top:6px}
.snow{position:absolute;inset:0;z-index:1;pointer-events:none}
.snow i{position:absolute;top:-10px;width:5px;height:5px;border-radius:50%;background:#fff;opacity:.75;animation:fall linear infinite}
@keyframes fall{to{transform:translate(18px,105vh)}}
/* 입력칸 */
.slip{display:block;width:100%;min-height:120px;margin-top:14px;border:1px solid var(--line);border-radius:12px;background:#FFFDF7;padding:14px 16px;font-family:"Nanum Pen Script",cursive;font-size:26px;line-height:32px;color:#2a2520;resize:none}
.slip::placeholder{color:#c4b6a3}
.form{margin-top:16px;display:grid;gap:10px}
.form label{font-size:13px;color:var(--ink2)}
.form input{width:100%;height:50px;border:1px solid var(--line);border-radius:12px;background:#FFFDF7;padding:0 14px;font-size:17px;color:var(--ink)}
.seg{display:flex;gap:8px}
.seg button{flex:1;height:44px;border-radius:12px;border:1px solid var(--line);background:#FFFDF7;color:var(--ink2);font-size:15px}
.seg button.on{background:var(--wood);color:#FFF4E2;border-color:var(--wood)}
.row2{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.chk{font-size:14px;color:var(--ink2);display:flex;gap:6px;align-items:center;white-space:nowrap}
.err{font-size:13px;color:var(--red);min-height:18px}
.sent{margin-top:16px;font-family:var(--serif);font-size:17px;line-height:30px;color:var(--ink2);text-align:center}
.sent select{font-family:var(--sans);font-size:16px;height:40px;border-radius:10px;border:1px solid var(--line);background:#FFFDF7;color:var(--ink);padding:0 8px;margin:0 4px}
/* 맥 짚기 */
.pulse-zone{position:absolute;z-index:3;left:50%;top:79%;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;touch-action:none}
.pulse-zone::before,.pulse-zone::after{content:"";position:absolute;inset:30px;border-radius:50%;border:2px solid rgba(255,230,190,.9);animation:ring 1.1s ease-out infinite}
.pulse-zone::after{animation-delay:.55s}
@keyframes ring{from{transform:scale(.6);opacity:1}to{transform:scale(1.6);opacity:0}}
.pulse-zone.hold::before,.pulse-zone.hold::after{border-color:#ff9a7a;animation-duration:.8s}
.pulse-zone b{position:absolute;inset:44px;border-radius:50%;background:rgba(255,240,220,.85)}
.prog{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin:14px 0 4px}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--amber),var(--red));transition:width .15s linear}
.steam{text-align:center;font-size:13px;color:var(--ink3)}
/* 표지 */
.cover{position:relative;height:100vh;overflow:hidden}
.cover img{width:100%;height:100%;object-fit:cover}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(10,15,35,.45),rgba(10,15,35,.1) 45%,rgba(10,15,35,.55))}
.cover .ct{position:absolute;z-index:2;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#FFF7E6;text-shadow:0 2px 16px rgba(0,0,0,.6);text-align:center}
.cover .ey{font-family:var(--serif);font-size:16px;letter-spacing:1px}
.cover .nm{font-family:var(--serif);font-weight:700;font-size:72px;line-height:92px;margin:6px 0;letter-spacing:4px}
.cover .ln{font-family:var(--serif);font-size:20px;line-height:32px}
.cover .down{margin-top:28px;font-size:13px;opacity:.8;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(6px)}}

/* ── 결과(웹툰) ── */
.res{background:#fff;padding-bottom:150px}
.wt{padding:28px 0 12px}
.pn{position:relative;margin:0 0 56px}
.pn .im{display:block;width:100%;height:var(--h,420px);object-fit:cover;object-position:var(--p,center)}
.pn.box{margin-left:28px;margin-right:28px}.pn.box .im{border:2px solid #1d1d1d}
.pn.boxL{margin-left:16px;margin-right:84px}.pn.boxL .im{border:2px solid #1d1d1d}
.pn.boxR{margin-left:84px;margin-right:16px}.pn.boxR .im{border:2px solid #1d1d1d}
.pn.tilt .im{clip-path:polygon(0 6%,100% 0,100% 94%,0 100%)}
.pn.full .im{-webkit-mask-image:linear-gradient(#000 82%,transparent);mask-image:linear-gradient(#000 82%,transparent)}
.bb{position:absolute;z-index:3;background:#fff;border:1.5px solid #3a3a3a;border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;font-size:16px;line-height:24px;color:#1d1d1d;padding:22px 18px;aspect-ratio:1.15/1;opacity:0;transform:scale(.6);transition:opacity .25s,transform .35s cubic-bezier(.3,1.6,.5,1)}
.bb.in{opacity:1;transform:scale(1)}
.bb b{color:var(--red)}
.sfx{position:absolute;z-index:3;font-family:var(--serif);font-weight:700;font-size:28px;color:#1d1d1d;-webkit-text-stroke:5px #fff;paint-order:stroke;opacity:0;transition:opacity .2s .3s}
.sfx.in{opacity:1}
.cap{text-align:center;font-family:var(--serif);font-size:21px;line-height:34px;color:#4a4038;padding:16px 26px 40px}
.cap em{font-style:normal;color:var(--red)}
.cap small{display:block;font-family:var(--sans);font-size:13px;line-height:20px;color:#999;margin-top:8px}
/* 쪽지·맥 기록지 */
.wish .wt2{position:absolute;z-index:2;left:24%;right:24%;top:33%;text-align:center;font-family:"Nanum Pen Script",cursive;font-size:29px;line-height:34px;color:#2a2520;mix-blend-mode:multiply;transform:rotate(-1.5deg)}
.wish .ring{position:absolute;z-index:3;left:12%;width:76%;top:24%;height:42%;overflow:visible;mix-blend-mode:multiply}
.wish .ring path{fill:none;stroke:#C8352A;stroke-width:9;stroke-linecap:round;opacity:.85;stroke-dasharray:1;stroke-dashoffset:1}
.wish.in .ring path{animation:draw 1.1s .3s cubic-bezier(.5,0,.3,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.ms .grid{position:absolute;z-index:2;left:15%;right:15%;top:22%;bottom:22%;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:10px 8px;background:linear-gradient(160deg,#F8EBCF,#F1DDB6);border:1px solid #D8BF92;border-radius:3px;box-shadow:0 6px 14px rgba(90,50,20,.28);transform:rotate(-1.2deg)}
.ms .grid::before{content:"";position:absolute;inset:5px;border:1.5px solid rgba(178,60,46,.55);pointer-events:none}
.ms .grid div{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:space-around;font-family:var(--serif);border-left:1px solid rgba(178,60,46,.35)}
.ms .grid div:first-child{border-left:0}
.ms .grid small{font-size:12px;color:#7a5a4a}
.ms .grid b{font-size:30px;line-height:34px;color:#2a201a}
.ms .grid i{font-style:normal;font-size:11px;line-height:15px;color:#fff;border-radius:8px;padding:0 6px;margin-top:-8px}
.ms .grid div.me{background:rgba(192,57,43,.16);border-radius:4px;box-shadow:inset 0 0 0 1.5px rgba(192,57,43,.7)}
.soul{position:relative;margin:0 0 40px}
.soul img{display:block;width:100%;height:300px;object-fit:cover}
.soul p{position:absolute;left:0;right:0;bottom:12%;text-align:center;font-family:var(--serif);font-size:20px;line-height:32px;color:#fff;text-shadow:0 2px 10px rgba(10,20,45,.75)}
/* 블록 */
.blk{position:relative;margin:8px 14px 48px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px 20px}
.blk .ey{font-family:var(--serif);font-size:15px;color:var(--ink2);text-align:center}
.blk .tt{font-family:var(--serif);font-size:24px;line-height:34px;color:var(--wood);text-align:center;margin:4px 0 16px}
.blk .dv{width:120px;height:1px;background:var(--line);margin:0 auto 18px}
.ask{font-family:var(--serif);font-size:16px;line-height:26px;color:var(--ink2);text-align:center;margin-bottom:12px}
/* 저울 */
.scale svg{display:block;margin:0 auto;width:100%;max-width:320px}
.wbtns{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.wbtns button{height:58px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:13px;color:var(--ink2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.wbtns button b{font-family:var(--serif);font-size:18px;color:var(--ink)}
.wbtns button.on{background:#F3E6D0;border-color:#C9A25B}
.wres{margin-top:14px;display:grid;gap:6px}
.wres div{display:grid;grid-template-columns:40px 1fr 44px;gap:8px;align-items:center;font-size:14px;color:var(--ink2)}
.wres span.bar{height:10px;border-radius:10px;background:#EFE6D7;overflow:hidden}.wres span.bar i{display:block;height:100%;border-radius:10px}
.wres b{text-align:right;font-variant-numeric:tabular-nums}
/* 약연 긁기 */
.grind{position:relative;border-radius:16px;overflow:hidden;margin-top:6px}
.grind canvas{position:absolute;inset:0;width:100%;height:100%;z-index:2;touch-action:none;transition:opacity .6s}
.gradeCard{padding:24px 16px;text-align:center;background:#FBF3E3}
.gradeCard .g{font-family:var(--serif);font-weight:700;font-size:56px;line-height:66px;color:var(--red)}
.gradeCard .l{font-family:var(--serif);font-size:18px;line-height:28px;color:var(--ink);margin-top:4px}
.grades{display:flex;gap:4px;justify-content:center;margin:14px 0 4px;flex-wrap:wrap}
.grades span{font-size:12px;padding:3px 8px;border-radius:12px;background:#EFE6D7;color:#8a7a68}
.grades span.on{background:var(--wood);color:#fff}
.area{display:grid;grid-template-columns:90px 1fr;gap:8px 12px;margin-top:16px;font-size:15px;color:#6b5a49}
.area .low{color:var(--red);font-weight:600}
.moons i{display:inline-block;width:15px;height:15px;border-radius:50%;background:#E3B85A;margin-right:4px}.moons i.e{background:#EAE0CF}
/* 탈 카드 */
.tal{border:1px solid var(--line);border-radius:16px;padding:16px;background:#fff;margin-top:12px}
.tal h4{margin:0 0 10px;font-family:var(--serif);font-size:19px;color:var(--wood)}
.tal .r{display:grid;grid-template-columns:78px 1fr;gap:8px;font-size:15px;line-height:23px;padding:5px 0;border-top:1px dashed #eee}
.tal .r:first-of-type{border-top:0}
.tal .r b{font-size:12px;line-height:22px;color:#fff;background:#8a6a4e;border-radius:6px;text-align:center;height:22px}
.tal .r b.w{background:var(--red)}.tal .r b.g{background:#3e7a5e}
.lock{position:relative;margin-top:14px;border-radius:14px;background:#F4EDE2;padding:18px}
.lock h5{margin:0 0 10px;font-size:15px;text-align:center;color:var(--wood)}
.lock li{list-style:none;font-size:15px;line-height:24px;padding:3px 0;color:#4a3f35}
.lock li::before{content:"✓";display:inline-block;width:17px;height:17px;border-radius:50%;background:#C9A25B;color:#fff;font-size:11px;line-height:17px;text-align:center;margin-right:8px}
.lock ul{margin:0;padding:0}
.blur{filter:blur(5px);user-select:none}
/* 서랍 */
.drawers{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px;border-radius:12px;background:#6B4329;box-shadow:inset 0 0 0 3px #4d2f1d}
.drawers button{position:relative;height:74px;border:0;border-radius:6px;background:linear-gradient(#9A6A45,#85583A);box-shadow:inset 0 0 0 2px #5e3b25;color:#FFEFD6;transition:transform .3s}
.drawers button::after{content:"";position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px;border-radius:50%;border:3px solid #D9B464}
.drawers button.open{transform:translateY(-4px) scale(1.04);background:#F6EAD3;box-shadow:inset 0 0 0 2px #C9A25B,0 6px 10px rgba(0,0,0,.3);color:var(--ink)}
.drawers button.open::after{display:none}
.drawers button span{font-family:var(--serif);font-size:16px;display:block}
.drawers button small{font-size:11px;line-height:14px;display:block;margin-top:2px}
.drawers button.bad small{color:var(--red)}.drawers button.good small{color:#3e7a5e}
.react{min-height:24px;margin-top:12px;font-family:var(--serif);font-size:16px;line-height:26px;text-align:center;color:var(--wood)}
/* 마음·몸·사람 */
.flowsvg{width:100%;height:auto}
.day{border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:10px;background:#fff}
.day h4{margin:0 0 6px;font-family:var(--serif);font-size:18px;color:#5a6f7d}
.day.bad h4{color:var(--red)}
.day p{font-size:15px;line-height:23px;color:#4a3f35}
.clip{border-radius:14px;background:#FAF4E6;border:1px solid #E7DCC2;padding:18px}
.clip h4{margin:0;font-family:var(--serif);font-size:18px;text-align:center}
.clip small{display:block;text-align:center;font-size:12px;color:#8a7a68;margin:4px 0 10px}
.clip li{list-style:none;font-family:var(--serif);font-size:17px;line-height:32px;color:#5a4a3a;border-bottom:1px dashed #E7DCC2}
.clip ul{margin:0;padding:0}
.avoidp{border:1px solid var(--red);background:var(--redS);border-radius:14px;padding:14px;font-size:15px;line-height:23px}
.avoidp b{color:var(--red)}
.guiren{margin-top:16px;display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center}
.guiren img{width:120px;height:160px;object-fit:cover;border-radius:60px 60px 12px 12px;border:4px solid #D8B86A}
.guiren div p{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:7px 0;font-size:14px;color:#8a7a68}
.guiren div p b{font-family:var(--serif);color:var(--ink);font-size:15px}
/* 덤·목차·가격 */
.keys{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 14px 48px}
.keys div{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.keys img{display:block;width:100%;height:120px;object-fit:cover}
.keys p{padding:10px 12px 12px;font-size:13px;line-height:19px;color:var(--ink2)}
.keys p b{display:block;font-family:var(--serif);font-size:16px;color:var(--wood);margin-bottom:2px}
.toc{margin:0 14px 48px}
.toc h3{font-family:var(--serif);text-align:center;font-size:22px;color:var(--wood);margin:0 0 14px}
.ch{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.ch .no{display:inline-block;background:var(--wood);color:#FFF4E2;font-size:12px;border-radius:6px;padding:1px 8px}
.ch h4{margin:6px 0;font-family:var(--serif);font-size:18px}
.ch li{list-style:none;font-size:14px;line-height:26px;color:#4a3f35}
.ch ul{margin:0;padding:0}
.price{margin:0 14px 24px;background:linear-gradient(#F6E9D2,#FFFBF4);border:1px solid var(--line);border-radius:20px;padding:24px 20px}
.price h3{font-family:var(--serif);font-weight:700;text-align:center;font-size:40px;line-height:50px;margin:0;color:var(--wood);font-weight:400}
.price .r{display:flex;justify-content:space-between;font-size:15px;padding:7px 0;color:#6b5a49}
.price .fin{border-top:1px solid var(--line);margin-top:6px;padding-top:12px;display:flex;justify-content:space-between;align-items:baseline}
.price .fin b{font-size:28px}
.letter{margin:0 14px 24px;background:#FAF3E4;border-radius:20px;padding:26px 22px;font-family:var(--serif);font-size:17px;line-height:31px;color:#3a2f25}
.letter .sig{text-align:right;margin-top:14px}
/* 하단 고정 */
.cta{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(30,20,12,.94);padding:8px 16px calc(12px + env(safe-area-inset-bottom));display:none}
.cta.on{display:block}
.cta>div{max-width:448px;margin:0 auto}
.cta p{text-align:center;color:#fff;font-size:13px;line-height:20px;margin-bottom:6px}.cta p b{color:#FDE047;font-variant-numeric:tabular-nums}
.cta button{width:100%;height:52px;border:0;border-radius:12px;background:linear-gradient(90deg,#B8402F,#D8603F);color:#fff;font-size:17px;font-weight:600}
/* 끈 묶기 */
.tie{position:fixed;inset:0;z-index:50;background:rgba(20,12,6,.8);display:flex;align-items:center;justify-content:center}
.tie .box{position:relative;width:min(88vw,400px)}

<body>
<div id="app"></div>
<div class="cta" id="cta"><div><p>할인혜택 종료까지 <b id="timer">--:--:--:--</b></p><button id="buy">할미 약첩 전부 받기</button></div></div>
<script>
const KEY = (location.hash.match(/k=([^&]+)/) || [])[1] || "";
const Q = new URLSearchParams(location.search);
const API = Q.get("api") || "https://ddtmqpcrfrvdwxtpcsfb.supabase.co/functions/v1/halmi";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const IMG = (n) => `img/y/${n}.jpg`;
const WXK = { 木: "목", 火: "화", 土: "토", 金: "금", 水: "수" }, WXN = { 木: "나무", 火: "불", 土: "흙", 金: "쇠", 水: "물" };
const WXC = { 木: "#5E9C8F", 火: "#D9705A", 土: "#C9A25B", 金: "#9A948C", 水: "#4E5A7A" };
const CTL = { 木: "土", 火: "金", 土: "水", 金: "木", 水: "火" }, GEN = { 木: "火", 火: "土", 土: "金", 金: "水", 水: "木" };
const ELOF = (c) => ("甲乙寅卯".includes(c) ? "木" : "丙丁巳午".includes(c) ? "火" : "戊己辰戌丑未".includes(c) ? "土" : "庚辛申酉".includes(c) ? "金" : "水");
const hasJ = (w) => { const c = w.charCodeAt(w.length - 1) - 0xac00; return c >= 0 && c % 28 > 0; };
const voc = (w) => (hasJ(w) ? "아" : "야");
const EX = '<span class="ex">예시 값</span>';
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const LS = { get: (k) => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }, set: (k, v) => localStorage.setItem(k, JSON.stringify(v)) };

/* 입력값 (데모: ?demo=1 이면 다혜 예시로 바로 결과) */
let U = LS.get("yak_user") || { wish: "", name: "", y: "", m: "", d: "", cal: "solar", hour: "", minute: "", known: true, gender: "f", love: "", loveLen: "" };
if (Q.get("demo")) U = { wish: "내년에 미국 발령이 날 것 같은데, 가도 괜찮을까요?", name: "다혜", y: 1999, m: 1, d: 22, cal: "solar", hour: 17, minute: 30, known: true, gender: "f", love: "연애중", loveLen: "1년 ~ 3년" };
const save = () => LS.set("yak_user", U);
let CH = null, chP = null;
function fetchChart() {
  if (chP) return chP;
  const body = { action: "chart", y: +U.y, m: +U.m, d: +U.d, hour: U.known ? +U.hour : null, minute: U.known ? +U.minute : null, calendar: U.cal, gender: U.gender };
  chP = fetch(API, { method: "POST", headers: { "content-type": "application/json", "x-halmi-key": KEY }, body: JSON.stringify(body) }).then((r) => r.json()).then((j) => { if (!j.ok) throw new Error(j.error || "fail"); CH = j.viz; CH.gender = U.gender; return CH; });
  return chP;
}

/* 말이 한 글자씩 */
async function typeTo(el, text, speed = 38) { el.textContent = ""; for (const ch of text) { el.textContent += ch; await sleep(ch === "…" || ch === "." ? speed * 5 : speed); } }
async function says(lines, box) { box.innerHTML = lines.map(() => `<p class="say"></p>`).join(""); const ps = box.querySelectorAll(".say"); for (let i = 0; i < lines.length; i++) { await typeTo(ps[i], lines[i]); await sleep(260); } }
function show(html, bot = "") { $("#app").innerHTML = html; $("#cta").classList.remove("on"); window.scrollTo(0, 0); const b = document.querySelector(".bot"); if (b) b.remove(); if (bot) document.body.insertAdjacentHTML("beforeend", `<div class="bot"><div>${bot}</div></div>`); }
const scr = (img, inner, cls = "") => `<section class="sc ${cls}"><div class="pic"><img src="${IMG(img)}" alt=""></div><div class="low">${inner}</div></section>`;

/* S1 첫 화면 */
function S1() {
  const snow = Array.from({ length: 36 }, (_, i) => `<i style="left:${(i * 29) % 100}%;width:${3 + (i % 3)}px;height:${3 + (i % 3)}px;animation-duration:${7 + (i % 6)}s;animation-delay:-${(i * 0.6).toFixed(1)}s"></i>`).join("");
  show(`<section class="sc s1"><div class="pic"><img src="${IMG("S1")}" alt=""><div class="snow">${snow}</div><div class="tt"><p class="y">2027 정미년</p><h1>할미약방</h1><p class="a">아프기 전에 짓는 약</p><p class="b">때와 맥을 짚어, 미리 막는 집</p></div></div></section>`, `<button class="btn" id="go">약방 문 열기</button>`);
  $("#go").onclick = S2;
}
/* S2 문 열기 */
async function S2() {
  show(scr("S2a", `<div id="say"></div>`), `<button class="btn" id="go" disabled>할미, 저 어디가 안 좋아요?</button>`);
  await says(["아이고, 우리 아가 왔구나. 이 추운 밤에… 얼른 들어와서 몸부터 녹이거라.", "벌써 또 한 해가 저무는구나. 세월 참 빠르지… 곧 2027년이란다."], $("#say"));
  await sleep(500);
  document.querySelector(".pic img").src = IMG("S2b");
  await says(["그런데 얼굴이 왜 이리 핼쑥하누. 쯧쯧… 맥을 한번 짚어 봐야겠구나. 몇 군데 탈이 보이는구먼."], $("#say"));
  $("#go").disabled = false; $("#go").onclick = S3;
}
/* S3 마음에 걸리는 것 */
async function S3() {
  show(scr("S3", `<div id="say"></div><textarea class="slip" id="wish" maxlength="200" placeholder="예) 내년에 미국 발령이 날 것 같은데, 가도 괜찮을까요?">${esc(U.wish)}</textarea>`, "form-sc"), `<button class="btn" id="go">다 적었어요</button><button class="lnk" id="skip">딱히 없어요</button>`);
  $("#go").onclick = () => { U.wish = $("#wish").value.trim(); save(); S4(); };
  $("#skip").onclick = () => { U.wish = ""; save(); S4(); };
  await says(["급할 거 하나 없다. 따뜻할 때 차부터 한 모금 마시거라.", "내년 생각하면 자꾸 마음에 걸리는 거 있지? 그거 하나만 여기 적어 보련?"], $("#say"));
}
/* S4 접수표 */
async function S4() {
  const b8 = U.y ? `${U.y}${String(U.m).padStart(2, "0")}${String(U.d).padStart(2, "0")}` : "";
  const tm = U.known && U.hour !== "" ? `${String(U.hour).padStart(2, "0")}:${String(U.minute).padStart(2, "0")}` : "";
  show(scr("S4", `<div id="say"></div><div class="form">
    <div><label>이름</label><input id="nm" maxlength="10" value="${esc(U.name)}" placeholder="홍길동"></div>
    <div><label>생년월일</label><div class="row2"><input id="bd" inputmode="numeric" maxlength="8" value="${b8}" placeholder="생년월일 8자리 (예: 19990122)"><div class="seg" style="width:120px"><button data-c="solar" class="${U.cal === "solar" ? "on" : ""}">양력</button><button data-c="lunar" class="${U.cal === "lunar" ? "on" : ""}">음력</button></div></div></div>
    <div><label>태어난 시간</label><div class="row2"><input id="tm" inputmode="numeric" maxlength="5" value="${tm}" placeholder="예: 13:20" ${U.known ? "" : "disabled"}><label class="chk"><input type="checkbox" id="unk" ${U.known ? "" : "checked"} style="width:auto;height:auto"> 모름</label></div></div>
    <div><label>성별</label><div class="seg" id="gd"><button data-g="f" class="${U.gender === "f" ? "on" : ""}">여자</button><button data-g="m" class="${U.gender === "m" ? "on" : ""}">남자</button></div></div>
    <p class="err" id="err"></p></div>`, "form-sc"), `<button class="btn" id="go">할미한테 맡기기</button>`);
  document.querySelectorAll("[data-c]").forEach((b) => (b.onclick = () => { U.cal = b.dataset.c; document.querySelectorAll("[data-c]").forEach((x) => x.classList.toggle("on", x === b)); }));
  document.querySelectorAll("[data-g]").forEach((b) => (b.onclick = () => { U.gender = b.dataset.g; document.querySelectorAll("[data-g]").forEach((x) => x.classList.toggle("on", x === b)); }));
  $("#unk").onchange = (e) => { $("#tm").disabled = e.target.checked; };
  $("#go").onclick = () => {
    const nm = $("#nm").value.trim(), bd = $("#bd").value.replace(/\D/g, ""), t = $("#tm").value.replace(/[^\d]/g, "");
    if (!nm) return ($("#err").textContent = "이름을 적어 주거라.");
    if (bd.length !== 8) return ($("#err").textContent = "생년월일은 8자리로 적어 주거라. 예) 19990122");
    const y = +bd.slice(0, 4), m = +bd.slice(4, 6), d = +bd.slice(6, 8);
    if (y < 1920 || y > 2015 || m < 1 || m > 12 || d < 1 || d > 31) return ($("#err").textContent = "날짜가 맞는지 한 번 더 봐 주거라.");
    const unk = $("#unk").checked; let hh = "", mi = "";
    if (!unk) { if (t.length < 3) return ($("#err").textContent = "시간은 13:20처럼 적거나 «모름»을 눌러라."); hh = +t.slice(0, t.length - 2); mi = +t.slice(-2); if (hh > 23 || mi > 59) return ($("#err").textContent = "시간이 맞는지 봐 주거라."); }
    Object.assign(U, { name: nm, y, m, d, known: !unk, hour: hh, minute: mi }); save(); chP = null; fetchChart().catch(() => {}); S5();
  };
  await says(["먼저 언제 태어났는지부터 적어 보거라. 타고난 바탕이 거기 다 적혀 있거든."], $("#say"));
}
/* S5 마음 주는 사람 */
async function S5() {
  const LV = ["선택 안함", "솔로", "연애중", "짝사랑중", "썸타는중", "기혼"], LL = ["선택 안함", "3개월 미만", "3개월 ~ 1년", "1년 ~ 3년", "3년 ~ 5년", "5년 이상"];
  const opt = (a, v) => a.map((x) => `<option ${x === v ? "selected" : ""}>${x}</option>`).join("");
  show(scr("S5", `<div id="say"></div><p class="sent">지금은 <select id="lv">${opt(LV, U.love || "선택 안함")}</select> 상태예요.</p><p class="sent">기간은 <select id="ll">${opt(LL, U.loveLen || "선택 안함")}</select> 이에요.</p><p class="hint">답하지 않아도 넘어갈 수 있어요.</p>`, "form-sc"), `<button class="btn" id="go">다음으로</button>`);
  $("#go").onclick = () => { const a = $("#lv").value, b = $("#ll").value; U.love = a === "선택 안함" ? "" : a; U.loveLen = b === "선택 안함" ? "" : b; save(); S6(); };
  await says([`${U.name}${hasJ(U.name) ? "이" : ""}라… 고것 참, 이름도 곱구나.`, "하나만 더 묻자꾸나. 요새 마음 주는 사람은 있니?"], $("#say"));
}
/* S6 맥 짚기 (꾹 누르기) */
async function S6() {
  fetchChart().catch(() => {});
  show(`<section class="sc"><div class="pic" style="height:66vh"><img src="${IMG("S6")}" alt="" style="animation:none"><div class="pulse-zone" id="pz"><b></b></div></div><div class="low"><div id="say"></div><div class="prog"><i id="pg"></i></div><p class="steam" id="st">손목을 꾹 누르고 있어요</p></div></section>`, `<button class="btn" id="go" disabled>표지 보기</button>`);
  await says(["태어난 때는 타고난 바탕이고, 맥은 지금 네 기운이란다. 둘을 같이 봐야 앞날이 보이지.", "자, 손목 이리 내 보거라. 가만히, 빼지 말고."], $("#say"));
  const SUB = ["…어디 가만있어 보자", "아이고, 손목이 이게 뭐냐. 얼음장이네", "맥이 가라앉았구나. 요새 많이 지쳤지", "내년 이맘때까지 어디서 탈이 나는지, 할미가 보고 있단다"];
  let p = 0, holding = false, last = 0, beat = 0, done = false;
  const pz = $("#pz"), st = $("#st"), sayBox = $("#say");
  const start = (e) => { e.preventDefault(); if (done) return; holding = true; pz.classList.add("hold"); last = performance.now(); loop(); };
  const stop = () => { if (done || !holding) return; holding = false; pz.classList.remove("hold"); st.textContent = "아직이다, 조금만 더. 다시 꾹 눌러 보거라"; };
  pz.addEventListener("pointerdown", start); window.addEventListener("pointerup", stop); pz.addEventListener("pointerleave", stop);
  async function loop() {
    if (!holding || done) return;
    const now = performance.now(); p = Math.min(1, p + (now - last) / 9000); last = now;
    $("#pg").style.width = p * 100 + "%";
    const i = Math.min(SUB.length - 1, Math.floor(p * SUB.length)); if (sayBox.dataset.i != i) { sayBox.dataset.i = i; sayBox.innerHTML = `<p class="say">${SUB[i]}</p>`; }
    st.textContent = "맥 짚는 중…";
    if (now - beat > 850) { beat = now; navigator.vibrate?.([40, 110, 30]); }
    if (p >= 1) {
      done = true; holding = false; pz.classList.remove("hold"); st.textContent = "약탕기 물이 다 끓었다";
      try { await fetchChart(); sayBox.innerHTML = `<p class="say">됐다. 이제 손 거둬도 된다.</p>`; $("#go").disabled = false; $("#go").onclick = S8; }
      catch { sayBox.innerHTML = `<p class="say">맥이 잘 안 잡히는구나. 링크를 다시 확인해 주거라.</p>`; }
      return;
    }
    requestAnimationFrame(loop);
  }
}
/* S8 표지 → 결과 */
function S8() {
  show(`<section class="cover"><img src="${IMG("S8")}" alt=""><div class="ct"><p class="ey">${U.y}년 ${String(U.m).padStart(2, "0")}월 ${String(U.d).padStart(2, "0")}일생</p><p class="nm">${esc(U.name)}</p><p class="ln">${esc(U.name)}의 2027년,<br>다칠 곳부터 짚어 보마</p><p class="down">아래로 내려 읽어요 ↓</p></div></section><div id="res"></div>`);
  $("#cta").classList.add("on");
  renderResult(CH);
}

/* ── 결과 ── */
function pn(o) {
  const bs = (o.b || []).map((b) => `<div class="bb" style="left:${b.x}%;top:${b.y}%;width:${b.w || 52}%"><span>${b.t}</span></div>`).join("");
  const fx = (o.sfx || []).map((f) => `<span class="sfx" style="left:${f.x}%;top:${f.y}%;transform:rotate(${f.r || -8}deg)">${f.t}</span>`).join("");
  return `<div class="pn ${o.kind || "box"}" style="--h:${o.h || 420}px;--p:${o.pos || "center"}"><img class="im" src="${IMG(o.img)}" alt="" loading="lazy">${bs}${fx}</div>`;
}
const capt = (h, s = "") => `<p class="cap">${h}${s ? `<small>${s}</small>` : ""}</p>`;
const lockList = (t, items) => `<div class="lock"><h5>🔒 ${t}</h5><ul>${items.map((x) => `<li>${esc(x)}</li>`).join("")}</ul></div>`;
const GRADES = ["대길", "길", "중길", "소길", "말길", "흉", "대흉"];
const gradeOf = (v) => (/힘이 붙/.test(v.yearVerdict) ? "길" : /섞인/.test(v.yearVerdict) ? "소길" : /정리/.test(v.yearVerdict) ? "소길" : "말길");
const shortV = (t) => (/조심/.test(t) ? "조심해서 지나갈 해" : /힘이 붙/.test(t) ? "힘이 붙는 해" : /섞인/.test(t) ? "좋고 나쁨이 섞인 해" : /정리/.test(t) ? "차분히 정리할 해" : t);
function areas(v) {
  const dm = ELOF(v.dm), use = new Set(v.useful), avoid = new Set(v.avoid);
  const wealth = CTL[dm], officer = Object.keys(CTL).find((e) => CTL[e] === dm), parent = Object.keys(GEN).find((e) => GEN[e] === dm), child = GEN[dm];
  const sc = (e) => 3 + (use.has(e) ? 1 : 0) - (avoid.has(e) ? 1 : 0);
  const c = (n) => Math.max(1, Math.min(5, n));
  return [["돈", c(sc(wealth))], ["마음", c(sc(v.gender === "m" ? wealth : officer))], ["일·명예", c(sc(officer))], ["시험·계약", c(sc(parent))], ["몸", c(sc(child) - (v.climate?.tempLabel === "차가운 사주" ? 1 : 0))]].sort((a, b) => a[1] - b[1]);
}
const ORG = { 木: ["간·담", ["간 초음파", "간기능 혈액검사", "담낭 초음파", "눈 검사", "근육·힘줄 검사"], "간 쪽"], 火: ["심장·소장", ["심전도", "심장 초음파", "혈압 24시간 측정", "소장 검사", "혈관 검사"], "가슴이 늘 서늘했지? 심장 쪽"], 土: ["위·비장", ["위내시경", "복부 초음파", "혈당 검사", "췌장 검사", "소화기 검사"], "속이 자주 더부룩했지? 위장 쪽"], 金: ["폐·대장", ["흉부 X-ray", "폐기능 검사", "대장내시경", "피부 검사", "비염 검사"], "숨이 자주 짧았지? 폐 쪽"], 水: ["신장·방광", ["신장기능 혈액검사", "소변 검사", "방광 초음파", "호르몬 검사", "골밀도 검사"], "허리가 자주 시렸지? 콩팥 쪽"] };
const REL = (dmE, e) => (e === dmE ? ["친구·동료", "같은 편"] : GEN[dmE] === e ? ["후배·아랫사람", "내가 챙기는 사람"] : CTL[dmE] === e ? ["돈이 얽힌 사람", "거래 상대"] : CTL[e] === dmE ? ["윗사람·상사", "나를 재는 사람"] : ["어른·스승", "나를 받쳐 주는 사람"]);

  H.push(pn({ img: "R15c", h: 320, kind: "full", pos: "center 30%", b: [{ t: "또 지나고 나서야<br>알 셈이니?<br><b>할미는 그 꼴 못 본단다.</b>", x: 46, y: 54, w: 52 }] }));

/* 저울 */
function bindScale(v) {
  const done = new Set(), res = $("#wres");
  document.querySelectorAll("#scale [data-e]").forEach((b) => (b.onclick = () => {
    const e = b.dataset.e; if (done.has(e)) return; done.add(e); b.classList.add("on");
    const p = Math.round(v.pct[e]);
    $("#beam").style.transform = `rotate(${Math.max(-22, Math.min(22, (p - 20) * 0.7))}deg)`;
    $("#pl").textContent = `${WXN[e]} ${p}`;
    navigator.vibrate?.(20);
    res.insertAdjacentHTML("beforeend", `<div><span>${WXN[e]}</span><span class="bar"><i style="width:${Math.min(100, p * 2)}%;background:${WXC[e]}"></i></span><b>${p}</b></div>`);
    if (done.size === 5) {
      const heavy = Object.entries(v.pct).sort((a, b) => b[1] - a[1])[0][0], weak = Object.entries(v.pct).sort((a, b) => a[1] - b[1])[0][0];
      $("#wsay").textContent = `${WXN[heavy]}은 이렇게 무겁고, ${WXN[weak]}은… 거의 없구나.`;
    }
  }));
}
/* 약연 긁기 */
function bindGrind() {
  const wrap = $("#grind"), c = $("#gc"), r = wrap.getBoundingClientRect();
  c.width = r.width * 2; c.height = r.height * 2; const x = c.getContext("2d"); x.scale(2, 2);
  const g = x.createLinearGradient(0, 0, r.width, r.height); g.addColorStop(0, "#9B7A4E"); g.addColorStop(1, "#6F5233"); x.fillStyle = g; x.fillRect(0, 0, r.width, r.height);
  for (let i = 0; i < 900; i++) { x.fillStyle = ["#C9A25B", "#5E7A45", "#8E3B2E", "#E8D3A4", "#4A3420"][i % 5]; x.globalAlpha = 0.55; x.beginPath(); x.ellipse(Math.random() * r.width, Math.random() * r.height, 1 + Math.random() * 4, 0.6 + Math.random() * 1.5, Math.random() * 3, 0, 7); x.fill(); }
  x.globalAlpha = 1; x.fillStyle = "#FFF4E2"; x.font = "600 17px Pretendard Variable, sans-serif"; x.textAlign = "center"; x.fillText("손가락으로 문질러 갈아 보거라", r.width / 2, r.height / 2);
  x.globalCompositeOperation = "destination-out";
  let down = false, n = 0, done = false;
  const scratch = (ev) => { if (!down || done) return; const b = c.getBoundingClientRect(); x.beginPath(); x.arc(ev.clientX - b.left, ev.clientY - b.top, 22, 0, 7); x.fill(); if (++n % 12 === 0) { navigator.vibrate?.(8); check(); } };
  const check = () => { const d = x.getImageData(0, 0, c.width, c.height).data; let clear = 0; for (let i = 3; i < d.length; i += 64) if (d[i] === 0) clear++; if (clear / (d.length / 64) > 0.45) { done = true; c.style.opacity = 0; setTimeout(() => c.remove(), 650); $("#after").style.display = ""; } };
  c.addEventListener("pointerdown", (e) => { down = true; c.setPointerCapture(e.pointerId); scratch(e); });
  c.addEventListener("pointermove", scratch); c.addEventListener("pointerup", () => (down = false));
}
/* 서랍 세 칸 */
function bindDrawers(v, months) {
  const picked = [];
  document.querySelectorAll("#dr button").forEach((b) => (b.onclick = () => {
    if (picked.length >= 3 || b.classList.contains("open")) return;
    const i = +b.dataset.i; picked.push(i); navigator.vibrate?.(15);
    const isC = v.caution.some((c) => c.idx === i), isO = v.chance.includes(i);
    b.classList.add("open", isC ? "bad" : isO ? "good" : "mid");
    b.innerHTML = `<span>${MK(months[i])}</span><small>${isC ? "윗사람과 부딪힘" : isO ? "일이 풀림" : "고르게 감"}</small>`;
    $("#drsay").textContent = isC ? `아이고, 하필 ${MK(months[i])}을 열었구나. 그 달엔 윗사람이랑 한 번 크게 부딪히겠어.` : isO ? `${MK(months[i])}이라… 그 달엔 일이 술술 풀린단다. 그때 움직이거라.` : `${MK(months[i])}은 고르게 가는 달이구나.`;
    if (picked.length === 3) $("#drlock").innerHTML = lockList("나머지 약첩에 든 것", ["세 서랍이 말하는 내년 일 흐름", "옮길 때와 버틸 때", "윗사람과 부딪히는 날", "일에서 크게 다칠 곳과 막는 법"]);
  }));
}

/* 할인 타이머 */
let end = +localStorage.getItem("yak_deal") || 0;
(function tick() { const now = Date.now(); if (!end || end <= now) { end = now + (15 * 3600 + 45 * 60 + 32) * 1000; localStorage.setItem("yak_deal", end); } const ms = end - now, p = (n) => String(n).padStart(2, "0"); const t = $("#timer"); if (t) t.textContent = `${p(Math.floor(ms / 3600000))}:${p(Math.floor(ms / 60000) % 60)}:${p(Math.floor(ms / 1000) % 60)}:${p(Math.floor(ms / 10) % 100)}`; requestAnimationFrame(tick); })();
