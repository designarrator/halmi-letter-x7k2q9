<html lang="ko">
<head>

<title>막아 주는 할미 · 2027 정미년</title>

<style>
/* 막아 주는 할미 v2 — 기준: 벤치마킹 결제본(청월당: 상세 길게→결제→결과, 명조·종이·웹툰 컷+말풍선) + 할미 그림 색.
   키트 값: 글자 24/20/17/13(줄 34/30/27/19), 간격 4px 배수, 모서리 12/16/20. 색은 아래 변수만. */
:root{--paper:#F6F1E7;--card:#FBF8F2;--line:#E4DACB;--ink:#2B2622;--ink2:#6E6459;--ink3:#9A8F83;--indigo:#55578A;--indigo-p:#46487A;--indigo-s:#ECEBF4;--persim:#C8553D;--persim-s:#F8E6DF;--oat:#E9DCC3;--white:#FFFFFF;
--w-wood:#5E9C8F;--w-fire:#D9705A;--w-earth:#C9A25B;--w-metal:#A8A29A;--w-water:#4E5A7A;--r12:12px;--r16:16px;--r20:20px;--serif:"MaruBuri",serif;--sans:"Pretendard Variable",Pretendard,-apple-system,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);word-break:keep-all;-webkit-text-size-adjust:100%;overflow-x:hidden}
body{background:var(--paper) radial-gradient(rgba(120,100,70,.05) 1px,transparent 1px) 0 0/4px 4px}
.screen{max-width:480px;margin:0 auto;padding:0 20px 160px;min-height:100vh;animation:in .25s ease-out}

h1{font-size:24px;line-height:34px;font-weight:700;margin:24px 0 8px}

h3{font-size:17px;line-height:27px;font-weight:700;margin:0}
p{margin:0}
button{padding:0;font:inherit}
.sub{font-size:17px;line-height:27px;color:var(--ink2);margin:0 0 24px}
.cap{font-family:var(--sans);font-size:13px;line-height:19px;color:var(--ink3)}
.brand{display:flex;align-items:center;justify-content:space-between;height:56px;margin:0 -20px;padding:0 20px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:4}
.brand b{font-size:17px;line-height:27px;font-weight:700}.brand .stamp{transform:none}
.top{display:flex;align-items:center;gap:8px;height:56px;margin:0 -8px}

.stamp{display:inline-block;border:2px solid var(--persim);color:var(--persim);font-family:var(--serif);font-size:13px;line-height:19px;padding:0 8px;border-radius:4px;transform:rotate(-3deg);font-weight:700;background:rgba(255,255,255,.4)}

.ex b{display:block;font-size:17px;line-height:27px}.ex span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--sans);font-size:13px;line-height:19px;color:var(--ink2);margin-top:4px}

.sos b{display:block;font-size:20px;line-height:30px}.sos span{font-family:var(--sans);font-size:13px;line-height:19px;color:var(--ink2)}
/* 버튼 */
.cta{position:fixed;left:0;right:0;bottom:0;padding:12px 20px calc(16px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line);z-index:5}
.cta>div{max-width:480px;margin:0 auto}
.cta .note{text-align:center;font-family:var(--sans);font-size:13px;line-height:19px;color:var(--ink2);margin-bottom:8px}
button.btn{width:100%;height:56px;border:0;border-radius:var(--r16);background:var(--indigo);color:var(--white);font-family:var(--sans);font-size:17px;font-weight:600;transition:transform .1s}
button.btn:active{transform:scale(.97);background:var(--indigo-p)}button.btn:disabled{background:var(--line);color:var(--ink3)}
button.link{display:block;width:100%;height:48px;background:none;border:0;font-family:var(--sans);font-size:17px;color:var(--ink2);text-decoration:underline}
.err{font-family:var(--sans);font-size:13px;line-height:19px;color:var(--persim);margin-top:8px}
.center{text-align:center;padding-top:96px}.center h1{margin-top:16px}
.toast{position:fixed;left:50%;bottom:112px;transform:translateX(-50%);background:var(--ink);color:var(--white);font-family:var(--sans);font-size:17px;line-height:27px;padding:12px 20px;border-radius:var(--r20);z-index:9;max-width:90%;text-align:center}
.dim{position:fixed;inset:0;background:var(--ink);opacity:.4;z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--card);border-radius:var(--r20) var(--r20) 0 0;padding:24px 20px calc(16px + env(safe-area-inset-bottom))}
.sheet>div{max-width:480px;margin:0 auto}.sheet h2{font-size:20px;line-height:30px;margin-bottom:8px}
/* 쓰는 중 */
.stage{display:flex;align-items:center;gap:12px;font-family:var(--sans);font-size:17px;color:var(--ink2);margin:8px 0 24px}
.dot{width:8px;height:8px;border-radius:var(--r12);background:var(--indigo);animation:pulse 1.2s infinite ease-in-out;flex:none}@keyframes pulse{50%{opacity:.25;transform:scale(.7)}}
.steps{list-style:none;padding:0;margin:16px 0 24px}.steps li{font-size:17px;line-height:27px;color:var(--ink3);padding:4px 0}.steps li.on{color:var(--ink);font-weight:700}.steps li.done{color:var(--ink2)}
/* 결과 */
.vd{background:var(--card);border:1px solid var(--line);border-radius:var(--r20);padding:20px;margin-top:8px}
.vd .t{font-size:20px;line-height:30px;font-weight:700;margin-top:8px}
.toc{margin-top:32px}.toc a{cursor:pointer;display:grid;grid-template-columns:32px 1fr;gap:8px;padding:12px 0;border-top:1px solid var(--line);font-size:17px;line-height:27px;color:var(--ink);text-decoration:none}.toc a b{color:var(--persim)}
.sec{margin-top:56px}
.chap{margin:0 0 8px}
.lh{margin:0 0 16px}
.letter{font-size:17px;line-height:27px}.letter p{margin:0 0 16px}
.sign{text-align:right;color:var(--ink2)}
.risk{background:var(--card);border:1px solid var(--line);border-radius:var(--r20);padding:20px;margin-bottom:16px}
.risk h3{margin:0 0 12px}.risk p{margin:0 0 12px}.risk p:last-child{margin:0}
.kv{display:grid;grid-template-columns:64px 1fr;gap:8px;padding:12px 0;border-top:1px solid var(--line);font-size:17px;line-height:27px}
.kv b{font-family:var(--sans);font-size:13px;line-height:27px;font-weight:600;color:var(--ink3)}
.kv.fix b{color:var(--indigo)}.kv.fix span{font-weight:700}
.mrow{display:grid;grid-template-columns:56px 1fr;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.mrow b{font-size:17px;line-height:27px;color:var(--indigo)}.mrow.c b{color:var(--persim)}
.mrow p{margin:0}.mrow small{display:block;font-family:var(--sans);font-size:13px;line-height:19px;color:var(--ink2)}
.letter p.days{font-family:var(--sans);font-size:13px;line-height:19px;color:var(--persim);margin:-4px 0 0 64px;padding-bottom:12px}
.viz,.temp,.bal{background:var(--card);border:1px solid var(--line);border-radius:var(--r20);padding:20px;margin:16px 0}
.viz h3,.temp h3,.bal h3{margin:0 0 4px}.viz .cap,.temp .cap,.bal .cap{margin:0 0 16px}
.tline{position:relative;height:12px;border-radius:var(--r12);background:linear-gradient(90deg,var(--w-water),var(--line),var(--w-fire))}
.tline i{position:absolute;top:-6px;width:4px;height:24px;border-radius:var(--r12);background:var(--ink);transform:translateX(-2px)}.tline i.y{background:var(--ink3)}
.tlab{display:flex;justify-content:space-between;margin-top:8px;font-family:var(--sans);font-size:13px;line-height:19px;color:var(--ink2)}
.brow{display:grid;grid-template-columns:56px 1fr 48px;align-items:center;gap:12px;font-size:17px;line-height:27px;padding:4px 0}
.brow .t{position:relative;height:12px;border-radius:var(--r12);background:var(--line)}
.brow .t i{position:absolute;left:0;top:0;height:100%;border-radius:var(--r12);background:var(--ink3)}.brow .t i.add{background:var(--persim);opacity:.35}.brow.use .t i.now{background:var(--indigo)}
.brow b{font-family:var(--sans);font-weight:600;text-align:right}
.mt{width:100%;border-collapse:separate;border-spacing:4px;table-layout:fixed}
.mt th{font-family:var(--sans);font-size:13px;line-height:19px;font-weight:400;color:var(--ink3);padding:0}
.mt td{background:var(--white);border:1px solid var(--line);border-radius:var(--r12);text-align:center;padding:8px 0;vertical-align:top}
.mt td b{display:block;font-size:20px;line-height:30px}.mt td small{display:block;font-family:var(--sans);font-size:13px;line-height:19px;color:var(--ink3)}
.mt td.y{background:var(--ink);border-color:var(--ink)}.mt td.y b,.mt td.y small{color:var(--white)}
.mt td em{display:block;font-style:normal;font-family:var(--sans);font-size:13px;line-height:19px;font-weight:600;margin-top:4px}
.mt td em.bad{color:var(--persim)}.mt td em.good{color:var(--indigo)}.mt td em.mid{color:var(--ink2)}
.ms{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.ms .h{font-family:var(--sans);font-size:13px;line-height:19px;color:var(--ink3);margin-bottom:8px}

.rows{display:flex;flex-direction:column;gap:8px;margin-top:40px}
.rowbtn{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:72px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:var(--r16);padding:16px;font-family:var(--serif);color:var(--ink)}
.rowbtn b{display:block;font-size:17px;line-height:27px}.rowbtn span{display:block;font-family:var(--sans);font-size:13px;line-height:19px;color:var(--ink3)}.rowbtn svg{flex:none;color:var(--ink3)}

<body>
<!-- 막아 주는 할미 v2: 청월당식 흐름(상세 → 결제 → 입력 → 쓰는 중 → 결과). 편지 엔진은 guard.html과 같은 서버 action guard(g3). guard.html은 비교용으로 그대로 둔다. -->
<div id="app"></div>
<script>
const API = new URLSearchParams(location.search).get("api") || "https://ddtmqpcrfrvdwxtpcsfb.supabase.co/functions/v1/halmi";
const frag = new URLSearchParams(location.hash.slice(1));
const KEY = frag.get("k") || "";
const IS_TEST = frag.get("test") === "1";
const $app = document.getElementById("app");
const S = { screen: "", me: null, input: null, id: null, text: "", viz: null, picks: null, tags: null, stage: 0, run: 0, rated: false };
const LS = { get: (k) => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const g = (id) => document.getElementById(id);
const KO = { 木: "목", 火: "화", 土: "토", 金: "금", 水: "수" };
const CHEV = `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>`;
const CHEV_R = `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>`;
const STAGES = ["네 체질을 재고 있어요", "2027년에 부딪히는 곳을 찾고 있어요", "막는 법을 쓰고 있어요", "글자를 한 번 더 확인하고 있어요"];
const EXAMPLES = [["해외로 가도 될까요", "회사에서 해외 발령 얘기가 나왔는데 아직 확정은 아니에요. 가고 싶은 마음도 있는데 가족이랑 떨어지는 게 무서워요. 가는 게 맞을까요?"], ["이직을 해도 될까요", "지금 회사에 5년 다녔는데 요즘 일이 손에 안 잡혀요. 이직 제안이 하나 왔는데, 내년에 옮겨도 괜찮을까요?"], ["연애가 자꾸 틀어져요", "만나는 사람마다 6개월을 못 넘기고 끝나요. 내년엔 오래 갈 사람을 만날 수 있을까요?"]];
function toast(m) { const t = document.createElement("div"); t.className = "toast"; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2400); }
function show(name, html, bind) { if (S.screen !== name && !S.popping) { try { history.pushState({ s: name }, ""); } catch {} } S.screen = name; $app.innerHTML = `<div class="screen ${name}" data-s="${name}">${html}</div>`; window.scrollTo(0, 0); bind && bind(); }
const cta = (label, id = "go", extra = "") => `<div class="cta"><div><button class="btn" id="${id}">${label}</button>${extra}</div></div>`;
const head = (step, back = true) => `<div class="top">${back ? `<button class="back" id="back" aria-label="뒤로">${CHEV}</button>` : `<span class="sp"></span>`}<div class="prog" aria-label="${step} / 2 단계">${[1, 2].map((n) => `<i class="${n <= step ? "on" : ""}"></i>`).join("")}</div></div>`;
async function call(body) { return fetch(API, { method: "POST", headers: { "content-type": "application/json", "x-halmi-key": KEY }, body: JSON.stringify(body) }); }
function sheet({ title, body, ok, no }) { return new Promise((res) => { const d = document.createElement("div"); d.innerHTML = `<div class="dim"></div><div class="sheet" role="dialog" aria-modal="true"><div><h2>${esc(title)}</h2><p class="sub">${esc(body)}</p><button class="btn" id="sh-ok">${esc(ok)}</button>${no ? `<button class="link" id="sh-no">${esc(no)}</button>` : ""}</div></div>`; document.body.appendChild(d); const done = (v) => { d.remove(); res(v); }; d.querySelector("#sh-ok").onclick = () => done(true); if (no) { d.querySelector("#sh-no").onclick = () => done(false); d.querySelector(".dim").onclick = () => done(false); } }); }
const ids = () => LS.get("guard_ids") || [];
function remember(id) { LS.set("guard_ids", [id, ...ids().filter((x) => x !== id)].slice(0, 5)); }

window.addEventListener("popstate", (e) => {
  const n = e.state && e.state.s; S.popping = true;
  try {
    if (S.screen === "read") S.run++;
    if (n === "pay") payScreen(); else if (n === "me") meScreen(); else if (n === "q") (S.me ? qScreen(S.input?.question ?? undefined) : startScreen());
    else if (n === "result" && S.text) resultScreen(); else if (n === "eval" && S.text) evalScreen(); else startScreen();

  const pos = (t) => Math.max(2, Math.min(98, 50 + t * 8));
  const c = z.climate;
  return `<div class="temp"><h3>내 그림의 온도</h3><p class="cap">${esc(c.season)}에 태어났어요 · ${esc(c.tempLabel)} · ${esc(c.wetLabel)}. 진한 표시가 지금, 옅은 표시가 2027년 기운이 더해진 뒤예요.</p><div class="tline"><i style="left:${pos(c.temp)}%"></i><i class="y" style="left:${pos(c.temp2027)}%"></i></div><div class="tlab"><span>차가움</span><span>뜨거움</span></div></div>`;
}
function balHtml() {
  const z = S.viz; if (!z || !z.balance) return "";
  const mx = Math.max(1, ...z.balance.map((b) => b.y2027));
  const rows = z.balance.map((b) => `<div class="brow ${z.useful.includes(b.e) ? "use" : ""}"><span>${b.e} ${b.ko}</span><div class="t"><i class="add" style="width:${(b.y2027 / mx) * 100}%"></i><i class="now" style="width:${(b.now / mx) * 100}%"></i></div><b>${b.now}${b.y2027 !== b.now ? "→" + b.y2027 : ""}</b></div>`).join("");
  const use = z.useful.map((e) => `${KO[e]}(${e})`).join("·"), av = z.avoid.map((e) => `${KO[e]}(${e})`).join("·");
  return `<div class="bal"><h3>${use ? `채울 기운은 ${esc(use)}` : "채울 기운"}${av ? `, 넘치는 기운은 ${esc(av)}` : ""}</h3><p class="cap">파란 막대가 채울 기운, 옅은 빨강은 2027년에 더해지는 몫이에요.</p>${rows}</div>`;
}

/* 장 이름(편지 소제목 순서와 같음)과 장마다 그림 */
const CHAPS = () => ["만세력 뜯어보기", "2027년 글자와 맞물리면", "그래서 조심할 것", S.input?.question ? "네 고민은 이렇게 흐른다" : "제일 크게 막을 것", "달마다", "매일 막는 법"];
const STAMPS = ["첫째 장", "둘째 장", "셋째 장", "넷째 장", "다섯째 장", "여섯째 장"];
const COVER = ["C1", "C2", "C3", "C4", "C5", "C6"];
const MID = [["D1", "think"], ["D2", "firm"], ["D3", "worry"], ["D4", "smile"], ["D5", "firm"], ["D6", "smile"]];
const EL = (ch) => ("甲乙寅卯".includes(ch) ? "wood" : "丙丁巳午".includes(ch) ? "fire" : "戊己辰戌丑未".includes(ch) ? "earth" : "庚辛申酉".includes(ch) ? "metal" : "water");
function myTable() {
  const z = S.viz; if (!z || !z.table) return "";
  const order = ["시", "일", "월", "년"].map((l) => z.table.find((c) => c.label === l)).filter(Boolean);
  const H = { 시: "시 · 앞날", 일: "일 · 나", 월: "월 · 부모", 년: "년 · 어린 시절" };
  return `<div class="viz"><h3>네 여덟 글자</h3><p class="cap">오른쪽부터 년·월·일·시. 테두리가 너 자신이에요.</p><div class="ms">${order.map((c) => `<div><p class="h">${H[c.label]}</p><div class="c ${c.label === "일" ? "me" : ""}" style="background:var(--w-${EL(c.gan)})">${c.gan}</div><p class="l">${esc(c.ganM)}</p><div class="c" style="background:var(--w-${EL(c.zhi)})">${c.zhi}</div><p class="l">${esc(c.zhiM)}</p></div>`).join("")}</div></div>`;
}
function meetHtml() {
  const z = S.viz; if (!z || !z.table) return "";
  const mark = (seat) => { const m = (z.meet || []).find((x) => x.seat === seat); if (!m) return ""; const bad = m.rels.some((r) => r !== "합") || m.el === "눌림"; const good = m.rels.includes("합") || m.el === "보태짐"; const EZ = { 충: "부딪힘", 형: "다그침", 파: "깨짐", 해: "서운함", 원진: "서먹함", 합: "묶임" }; const order = ["충", "형", "파", "원진", "해", "합"]; const top = order.find((r) => m.rels.includes(r)); const t = top ? EZ[top] : m.el; return `<em class="${bad ? "bad" : good ? "good" : "mid"}">${esc(t)}</em>`; };
  const T = ["시", "일", "월", "년"].map((l) => z.table.find((c) => c.label === l)).filter(Boolean); // 오른쪽부터 년·월·일·시(1장 표와 같은 순서)
  const cols = `<th>2027</th>` + T.map((c) => `<th>${c.label}</th>`).join("");
  const r1 = `<td class="y"><b>丁</b><small>등불</small></td>` + T.map((c) => `<td><b>${c.gan}</b><small>${esc(c.ganM)}</small>${mark(c.label + "간")}</td>`).join("");
  const r2 = `<td class="y"><b>未</b><small>마른 흙</small></td>` + T.map((c) => `<td><b>${c.zhi}</b><small>${esc(c.zhiM)}</small>${mark(c.label + "지")}</td>`).join("");
  return `<div class="viz"><h3>내 여덟 글자에 2027년이 닿으면</h3><p class="cap">글자 아래 빨간 말은 부딪히는 자리, 파란 말은 힘이 보태지는 자리예요.</p><table class="mt"><tr>${cols}</tr><tr>${r1}</tr><tr>${r2}</tr></table></div>`;
}

/* 편지 읽기 */
function parse(text) {
  const raw = text.replace(/\[\[[^\]]*\]\]/g, "");
  const cut = raw.indexOf("=== 서랍 ===");
  const main = cut >= 0 ? raw.slice(0, cut) : raw, drawer = cut >= 0 ? raw.slice(cut + 12) : "";
  const secs = [{ h: null, lines: [] }];
  for (const l of main.split("\n")) { if (/^##\s+/.test(l) && !/^###/.test(l)) secs.push({ h: l.replace(/^##\s+/, "").trim(), lines: [] }); else if (l.trim()) secs[secs.length - 1].lines.push(l.trim()); }
  return { opening: secs[0].lines.filter((l) => !/^사랑하는/.test(l)), secs: secs.slice(1), drawer };
}
const KV = /^(무엇이|왜|언\s*제|막는\s*법)\s*[·ㆍ]\s*(.+)$/;
const ITEM = /^(색|방향|몸|음식|습관|돌리기)\s*[·ㆍ]\s*(.+)$/;
const MROW = /^(?:2028년\s*)?(\d{1,2})월\s*[·ㆍ]\s*(.+?)\s*[·ㆍ]\s*(.+)$/;
const DAYS = /^(?:\d{1,2}월\s*)?조심할\s*날\s*[·ㆍ]\s*(.+)$/;
function lineHtml(t) {
  let m;
  if ((m = t.match(KV))) { const k = m[1].replace(/\s+/g, "").replace("막는법", "막는 법"); return `<div class="kv ${k === "막는 법" ? "fix" : ""}"><b>${k}</b><span>${esc(m[2])}</span></div>`; }
  if ((m = t.match(ITEM))) return `<div class="kv fix"><b>${m[1]}</b><span>${esc(m[2])}</span></div>`;
  if ((m = t.match(DAYS))) return `<p class="days">조심할 날 ${esc(m[1])}</p>`;
  if ((m = t.match(MROW))) { const n = +m[1]; const c = S.picks?.caution?.includes(n); return `<div class="mrow ${c ? "c" : ""}"><b>${n}월</b><div><p>${esc(m[2])}</p><small>${esc(m[3])}</small></div></div>`; }
  if (/^—\s*할미가/.test(t)) return `<p class="sign">${esc(t)}</p>`;
  return `<p>${esc(t)}</p>`;
}
const isPlain = (l) => !/^###\s+/.test(l) && !KV.test(l) && !ITEM.test(l) && !MROW.test(l) && !DAYS.test(l) && !/^—\s*할미가/.test(l);
function keyLine(lines) { // 장에서 말풍선에 올릴 한 문장: 일반 문단의 마지막 문장(짧은 것)
  const plain = lines.filter(isPlain); if (!plain.length) return "";
  const ss = plain[plain.length - 1].split(/(?<=[.?!])\s+/).filter(Boolean);
  const pick = [...ss].reverse().find((x) => x.length <= 44) || ss[0];
  return pick.length > 60 ? pick.slice(0, 58) + "…" : pick;
}
function secHtml(s, i) {
  const parts = []; let cur = null;
  for (const l of s.lines) { if (/^###\s+/.test(l)) { cur = { h: l.replace(/^###\s+/, ""), lines: [] }; parts.push(cur); } else if (cur) cur.lines.push(l); else parts.push({ h: null, lines: [l] }); }
  const html = parts.map((p) => (p.h ? `<div class="risk"><h3>${esc(p.h)}</h3>${p.lines.map(lineHtml).join("")}</div>` : p.lines.map(lineHtml).join("")));
  // 웹툰 컷은 장 가운데쯤(첫 덩어리 뒤)에 끼운다
  const at = Math.min(html.length, Math.max(1, Math.floor(html.length / 2)));
  const plainLines = s.lines.filter(isPlain);
  const bubbleSrc = i === 5 && plainLines.length ? [plainLines[0]] : s.lines; // 마지막 장은 마무리 말과 겹치지 않게 첫 문단에서
  const mid = MID[i] ? cut(`img/${MID[i][0]}.jpg`, keyLine(bubbleSrc), MID[i][1], i % 2 ? "r" : "") : "";
  html.splice(at, 0, mid);
  const viz = i === 0 ? myTable() + tempHtml() + balHtml() : i === 1 ? meetHtml() : "";
  return `<div class="sec letter" id="ch${i}">${COVER[i] ? `<img class="art" src="img/${COVER[i]}.jpg" alt="" loading="lazy">` : ""}<p class="chap" style="margin-top:16px"><span class="stamp">${STAMPS[i] || ""}</span> <span class="cap">${esc(CHAPS()[i] || "")}</span></p><h2 class="lh">${esc(s.h)}</h2>${i === 0 ? viz : ""}${html.join("")}${i !== 0 ? viz : ""}</div>`;
}
function resultScreen() {
  const L = parse(S.text);
  const v = S.tags?.verdict;
  const cap = v === "정리" ? "할미가 정리해 봤단다" : v === "조심" ? "쉽진 않지만 막을 길이 있단다" : "할미의 판정";
  const first = (L.opening[0] || "").split(/(?<=[.?!])\s+/)[0] || "";
  const toc = `<div class="toc"><h2 style="margin-bottom:8px">할미가 하나씩 짚어 줄게</h2>${L.secs.map((x, i) => `<a role="button" tabindex="0" data-ch="${i}"><b>${i + 1}</b><span>${esc(CHAPS()[i] || x.h)}</span></a>`).join("")}</div>`;
  const lastSec = L.secs.length ? L.secs[L.secs.length - 1].lines : [];
  const reopen = lastSec.filter(isPlain).find((l) => /다시 열어볼/.test(l)); // 마무리 «다시 열어볼 날» 문장
  const endLine = reopen ? (reopen.split(/(?<=[.?!])\s+/)[0] || "").slice(0, 60) : "";
  const pv = ids().find((x) => x !== S.id);
  show("result", `${brand()}<div class="res">
    ${cut("img/C0.jpg", first, v === "조심" ? "firm" : "smile")}
    <div class="vd"><p class="cap">${esc(cap)}</p><p class="t">${esc(L.opening.join(" "))}</p></div>
    ${toc}
    ${L.secs.map((x, i) => secHtml(x, i)).join("")}
    ${cut("img/C9.jpg", endLine || "다시 열어볼 날에 또 오너라.", "smile", "r")}
    <div class="rows">${pv ? `<button class="rowbtn" id="prev"><div><b>지난번에 받은 편지가 있어요</b><span>다시 보기</span></div>${CHEV_R}</button>` : ""}<button class="rowbtn" id="other"><div><b>다른 고민으로 받기</b><span>새 고민으로 편지 받기</span></div>${CHEV_R}</button></div>
    <p class="cap" style="margin-top:16px">사주는 판단 재료예요. 몸이 계속 불편하면 병원에 가 보세요.</p></div>
    ${S.rated ? "" : cta("편지 어땠는지 알려 주기")}`, () => {
    if (g("go")) g("go").onclick = () => evalScreen();
    document.querySelectorAll(".toc a").forEach((x) => (x.onclick = () => { const t = g("ch" + x.dataset.ch); if (t) window.scrollTo({ top: t.getBoundingClientRect().top + window.scrollY - 64, behavior: "smooth" }); }));
    g("other").onclick = () => qScreen("");
    if (g("prev")) g("prev").onclick = () => restore(pv);
  });
}

/* 평가 */
const QS = [["fun", "읽는 게 재밌었나요?"], ["me", "내 얘기 같았나요?"], ["help", "막는 법이 도움이 됐나요?"], ["heard", "할미가 내 마음을 알아준 것 같았나요?"]];
function evalScreen() {
  const rating = {};
  show("eval", `<h1>편지는 어땠나요?</h1><p class="sub">솔직하게 눌러 주세요. 편지를 더 좋게 만드는 데만 써요.</p>
    ${QS.map(([k, t]) => `<div class="qitem"><p>${t}</p><div class="scale" data-k="${k}">${[1, 2, 3, 4, 5].map((n) => `<button data-n="${n}" aria-pressed="false">${n}</button>`).join("")}</div><div class="cap"><span>전혀</span><span>매우</span></div></div>`).join("")}
    <div class="qitem"><p>한 줄로 남기고 싶은 말이 있나요? <span class="cap">(선택)</span></p><textarea id="fb" maxlength="300" placeholder="좋았던 점, 아쉬웠던 점 아무거나요"></textarea></div>
    ${cta("보내기", "go", `<button class="link" id="back">편지로 돌아가기</button>`)}`, () => {
    const go = g("go"); const upd = () => (go.disabled = !QS.every(([k]) => rating[k])); upd();
    document.querySelectorAll(".scale").forEach((sc) => (sc.onclick = (e) => { const b = e.target.closest("button"); if (!b) return; rating[sc.dataset.k] = +b.dataset.n; [...sc.children].forEach((c) => c.setAttribute("aria-pressed", String(c === b))); upd(); }));
    g("back").onclick = () => history.back();
    go.onclick = async () => { go.disabled = true; go.textContent = "보내는 중이에요"; try { const r = await call({ action: "rate", id: S.id, ...rating, feedback: g("fb").value.trim() }); if (!r.ok) throw 0; S.rated = true; doneScreen(); } catch { go.disabled = false; go.textContent = "보내기"; toast("전송이 안 됐어요. 연결을 확인하고 다시 눌러 주세요"); } };
  });
}
function doneScreen() { show("done", `<div class="center"><h1>알려 줘서 고마워요</h1><p class="sub">남겨 준 점수는 편지를 더 좋게 다듬는 데 써요.</p></div>${cta("다른 고민으로 받기", "go", `<button class="link" id="view">편지 다시 보기</button>`)}`, () => { g("go").onclick = () => qScreen(""); g("view").onclick = () => { S.popping = true; resultScreen(); S.popping = false; }; }); }
boot();
</script>
</body>
