:root{--g50:#F9FAFB;--g100:#F2F4F6;--g200:#E5E8EB;--g300:#D1D6DB;--g400:#B0B8C1;--g500:#8B95A1;--g600:#6B7684;--g700:#4E5968;--g800:#333D4B;--g900:#191F28;--primary:#3E5BD8;--primary-pressed:#3049B5;--primary-subtle:#EEF1FD;--danger:#E5484D;--r12:12px;--r16:16px;--r20:20px}

html,body{margin:0;background:#fff;color:var(--g900);font-family:"Pretendard Variable",Pretendard,-apple-system,sans-serif;word-break:keep-all;letter-spacing:-.01em;-webkit-text-size-adjust:100%;overflow-x:hidden}

button,input,select,textarea{line-height:27px}button{padding:0}

.top{display:flex;align-items:center;gap:8px;height:48px;margin:0 -12px 0 -12px}

.back{width:48px;height:48px;flex:none;border:0;background:none;display:flex;align-items:center;justify-content:center;color:var(--g800)}

.prog i{flex:1;height:4px;border-radius:var(--r12);background:var(--g200)}.prog i.on{background:var(--primary)}

button.link{display:block;width:100%;height:48px;background:none;border:0;font:inherit;font-size:17px;color:var(--g600);text-decoration:underline}

.center{text-align:center;padding-top:96px}.center h1{margin-top:16px}

/* 결과 */
.res{display:flex;flex-direction:column;gap:20px;padding-top:24px}
.vd{background:var(--primary-subtle);border-radius:var(--r20);padding:20px}
.vd .cap{color:var(--g600);margin-bottom:8px;font-weight:600}

.viz .cap{margin:0 0 16px}

.twist{border:1px solid var(--g200);border-radius:var(--r16);padding:16px}

details.fold{margin:24px 0 0;border-top:1px solid var(--g200);padding-top:8px}

details.fold .dr{font-size:17px;line-height:27px;color:var(--g800)}
details.fold .dr p{margin:0 0 12px}
table.t2{width:100%;border-collapse:collapse;font-size:17px}
table.t2 td,table.t2 th{padding:12px 4px;border-bottom:1px solid var(--g100);text-align:center}

.rows{display:flex;flex-direction:column;gap:8px}
.rowbtn{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:72px;text-align:left;border:1px solid var(--g200);background:#fff;border-radius:var(--r16);padding:16px;font:inherit;color:var(--g900)}
.rowbtn:active{background:var(--g50)}
.rowbtn b{display:block;font-size:17px;line-height:27px;font-weight:600}.rowbtn span{display:block;font-size:13px;line-height:19px;color:var(--g500)}
.rowbtn svg{flex:none;color:var(--g400)}
/* 평가 */
.qitem{margin:32px 0 0}.qitem p{font-size:17px;line-height:27px;font-weight:600;margin:0 0 12px}
.scale{display:flex;gap:8px}
.scale button{flex:1;height:56px;border-radius:var(--r16);border:1px solid var(--g200);background:#fff;font:inherit;font-size:17px;font-weight:600;color:var(--g700);transition:transform .1s}
.scale button:active{transform:scale(.97)}
.scale button[aria-pressed=true]{background:var(--primary);border-color:var(--primary);color:#fff}
.scale+.cap{display:flex;justify-content:space-between;margin-top:8px}
.sent{display:block;width:100%;text-align:left;border:1px solid var(--g200);background:#fff;border-radius:var(--r16);padding:12px 16px;font:inherit;font-size:17px;line-height:27px;color:var(--g800);margin-bottom:8px}
.sent[aria-pressed=true]{background:var(--primary-subtle);border-color:var(--primary)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#hrow select:disabled{pointer-events:none}
</style>

  ["친구의 남자친구를 좋아하게 됐어요", "좋아하는 사람이 있는데 제 친구 남자친구예요. 셋이 같이 모이는 자리에서 자꾸 눈이 가고, 걔도 저한테 유독 잘해 주는 것 같아서 더 헷갈려요. 친구한테는 절대 말 못 하고, 마음을 접으려고 일부러 연락도 줄였는데 잘 안 돼요. 제가 나쁜 사람 같아서 괴로워요. 내년엔 이 마음을 잘 접을 수 있겠죠?"],
  ["회사에서 미국 발령 얘기가 나왔는데 아직 확정이 아니에요", "회사에서 미국 발령 얘기가 나왔는데 아직 확정은 아니에요. 팀장님이 내년 상반기쯤 결정될 거라고만 하셨고, 가면 연봉도 오르고 하고 싶던 일을 할 수 있는데 가족이랑 떨어지는 게 무서워요. 가고 싶은 마음 반, 무서운 마음 반이에요. 아직 얘기 중인데 그래서 진짜 가게 될까요?"],
  ["헤어진 지 석 달, 다시 만날 수 있을까요", "석 달 전에 제가 헤어지자고 했어요. 그때는 서로 너무 지쳐 있었는데 요즘 자꾸 그 사람이 생각나요. 그 사람은 연락이 없다가 지난주에 제 인스타 스토리를 봤더라고요. 먼저 연락하면 자존심도 상하고, 괜히 다시 상처만 줄까 봐 무서워요. 내년에 우리가 다시 만나게 될 수도 있을까요?"],

  ["남편 때문에 시댁과 계속 부딪혀요", "결혼한 지 2년인데 시어머니가 매주 집에 오세요. 남편은 '어머니가 외로우셔서 그래'라며 제 편을 안 들어 줘요. 말을 꺼내면 제가 예민하다고 해서 요즘은 아예 말을 안 하는데, 이대로 가다간 제가 폭발할 것 같아요. 내년에는 이 관계가 좀 나아질 수 있을까요, 아니면 제가 뭔가를 결정해야 하는 해일까요?"],
  ["오래 짝사랑한 사람에게 고백해도 될까요", "같은 동아리 선배를 2년째 좋아하고 있어요. 친하긴 한데 그냥 후배 이상으로는 안 보는 것 같고, 얼마 전엔 다른 사람 얘기를 하길래 마음이 철렁했어요. 고백하면 이 사이마저 어색해질까 봐 못 하고 있어요. 내년에 제가 용기를 내면 좋은 결과가 있을까요? 언제쯤 말하는 게 좋을지도 궁금해요."],

const STAGES = ["명식을 펼치고 있어요", "2027년 기운을 맞춰 보고 있어요", "편지를 쓰고 있어요", "글자를 한 번 더 확인하고 있어요"];
const CHEV = `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>`;
const CHEV_R = `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>`;

/* ---------- 공통 ---------- */
function toast(m) { const t = document.createElement("div"); t.className = "toast"; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2400); }
// 화면 전환. 브라우저 뒤로가기도 같은 길로 가게 이력에 쌓는다.
function show(name, html, bind) {
  if (S.screen !== name && !S.popping) { try { history.pushState({ s: name }, ""); } catch {} }
  S.screen = name; $app.innerHTML = `<div class="screen ${name}" data-s="${name}">${html}</div>`; window.scrollTo(0, 0); bind && bind();
}
const cta = (label, id = "go", extra = "") => `<div class="cta"><div><button class="btn" id="${id}">${label}</button>${extra}</div></div>`;
const head = (step, back = true) => `<div class="top">${back ? `<button class="back" id="back" aria-label="뒤로">${CHEV}</button>` : `<span class="sp"></span>`}<div class="prog" aria-label="${step} / ${STEPS_N} 단계">${[...Array(STEPS_N)].map((_, i) => `<i class="${i < step ? "on" : ""}"></i>`).join("")}</div></div>`;
async function call(body, signal) { return fetch(API, { method: "POST", headers: { "content-type": "application/json", "x-halmi-key": KEY }, body: JSON.stringify(body), signal }); }
function sheet({ title, body, ok, no }) {
  return new Promise((res) => {
    const d = document.createElement("div");
    d.innerHTML = `<div class="dim"></div><div class="sheet" role="dialog" aria-modal="true"><div><h2>${esc(title)}</h2><p class="sub">${esc(body)}</p><button class="btn" id="sh-ok">${esc(ok)}</button>${no ? `<button class="link" id="sh-no">${esc(no)}</button>` : ""}</div></div>`;
    document.body.appendChild(d);
    const done = (v) => { d.remove(); res(v); };
    d.querySelector("#sh-ok").onclick = () => done(true);
    if (no) { d.querySelector("#sh-no").onclick = () => done(false); d.querySelector(".dim").onclick = () => done(false); }
  });
}
function myPrice() {
  if (PRICES.includes(S.price)) return S.price;
  let p = +LS.get("halmi_price");
  if (!PRICES.includes(p)) { p = PRICES[Math.floor(Math.random() * PRICES.length)]; LS.set("halmi_price", p); }
  return (S.price = p);
}
/* A/B 껍데기: a=상세페이지형(결제 먼저), b=부분 공개형(세배). 한 사람(브라우저)은 한 버전에 고정. #v=a|b 는 확인용으로 고정값을 바꾼다. */
const VAR = (() => { const f = frag.get("v"); if (f === "a" || f === "b") { LS.set("halmi_ab", f); return f; } let v = LS.get("halmi_ab"); if (v !== "a" && v !== "b") { v = Math.random() < 0.5 ? "a" : "b"; LS.set("halmi_ab", v); } return v; })();
const UID = (() => { let u = LS.get("halmi_uid"); if (!/^[a-z0-9-]{8,40}$/.test(u || "")) { u = (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + "-" + Math.random().toString(36).slice(2)).toLowerCase(); LS.set("halmi_uid", u); } return u; })();
const STEPS_N = VAR === "a" ? 4 : 3;
const ids = () => LS.get("halmi_ids") || [];
function remember(id) { LS.set("halmi_ids", [id, ...ids().filter((x) => x !== id)].slice(0, 5)); }
const prevId = () => ids().find((x) => x !== S.id) || null;

/* 결제 선 기록: 서버에 노출 가격·클릭·시각. 못 보내면 쌓아 두었다가 연결되면 다시 보낸다. */
const pwQ = () => LS.get("halmi_pw_q") || [];
async function sendPw(rec) { try { const r = await call({ action: "paywall", ...rec }); return r.ok || r.status === 404 || r.status === 400; } catch { return false; } }
async function logPw(id, patch) {
  const rec = { id, price: myPrice(), at: new Date().toISOString(), ...patch };
  if (!(await sendPw(rec))) LS.set("halmi_pw_q", [...pwQ(), rec]);
}
async function flushPw() { const q = pwQ(); if (!q.length) return; LS.set("halmi_pw_q", []); for (const rec of q) if (!(await sendPw(rec))) LS.set("halmi_pw_q", [...pwQ(), rec]); }
const unlockedIds = () => LS.get("halmi_unlocked") || [];

/* A/B 단계 기록: 두 버전 같은 이름(land·start·me·q·pay_view·pay_click·pay_skip·letter·full·rate). 못 보내면 쌓았다가 다시. */
const evQ = () => LS.get("halmi_ev_q") || [];
async function sendEv(rec) { try { const r = await call({ action: "event", ...rec }); return r.ok || r.status === 400; } catch { return false; } }
async function track(step, extra = {}) {
  const rec = { uid: UID, variant: VAR, step, price: myPrice(), test: IS_TEST, at: new Date().toISOString(), ...extra };
  if (!(await sendEv(rec))) LS.set("halmi_ev_q", [...evQ(), rec].slice(-50));
}
async function flushEv() { const q = evQ(); if (!q.length) return; LS.set("halmi_ev_q", []); for (const rec of q) if (!(await sendEv(rec))) LS.set("halmi_ev_q", [...evQ(), rec]); }

/* ---------- 이력(뒤로가기) ---------- */
window.addEventListener("popstate", (e) => {
  const n = e.state && e.state.s; S.popping = true;
  try {
    if (S.screen === "read") S.run++; // 쓰던 중이면 화면만 떠난다(서버는 끝까지 써서 저장해 둔다)
    const input = !!S.me;
    if (n === "me") meScreen(); else if (n === "q") (input ? qScreen(S.input?.question ?? undefined) : home());
    else if (n === "buy") (S.input ? buyScreen(S.input) : home());
    else if (n === "result" && S.text) resultScreen(); else if (n === "eval" && S.text) evalScreen();
    else if (n === "bow" || n === "detail" || !input) home(); else qScreen(S.input?.question);
  } finally { S.popping = false; }
});
window.addEventListener("online", () => { flushPw(); flushEv(); });

/* ---------- 0. 입장 ---------- */
async function boot() {
  try { history.replaceState({ s: VAR === "a" ? "detail" : "bow" }, ""); } catch {}
  S.me = LS.get("halmi_me");
  if (!KEY) return gateScreen();
  try {
    const r = await call({ action: "check" });
    if (r.status === 401) return gateScreen();
    if (!r.ok) throw 0;
  } catch { return offlineScreen(boot, "처음 화면"); }
  S.popping = true; home(); S.popping = false; flushPw(); flushEv(); track("land");
}
function gateScreen() {
  show("gate", `<div class="center"><h1>링크를 다시 확인해 주세요</h1><p class="sub">시험용 링크가 아니거나 주소 일부가 빠졌어요.<br>보내 드린 링크를 처음부터 끝까지 그대로 열어 주세요.</p></div>${cta("다시 열어 보기", "go")}`, () => { g("go").onclick = () => location.reload(); });
}
function offlineScreen(retry, what) {
  show("offline", `<div class="center"><h1>인터넷이 잠깐 끊겼어요</h1><p class="sub">연결되면 ${esc(what)}에서 이어서 할 수 있어요.<br>입력한 내용은 그대로 있어요.</p></div>${cta("다시 시도하기", "retry")}`, () => {
    g("retry").onclick = () => retry();
    window.addEventListener("online", () => S.screen === "offline" && retry(), { once: true });
  });
}

const home = () => (VAR === "a" ? detailScreen() : bowScreen());
const startTap = () => { track("start"); (S.me && S.me.name && S.again ? qScreen("") : meScreen()); };

/* ---------- (B) ① 세배 ---------- */
function bowScreen() {
  show("bow", `${head(1, false)}<div class="ph" aria-hidden="true"></div><h1>세배하면 할미가<br>고민 하나를 들어준단다</h1>${cta("세배하기")}`, () => { g("go").onclick = startTap; });

/* ---------- (A) ① 상세페이지 ---------- */
const LETTER_HAS = [["할미의 판정", "내 질문에 될지 안 될지부터 한 줄로"], ["왜 그런지", "내 사주 그림과 2027년 기운으로 풀어요"], ["질문의 달력", "기회의 달 두 번, 숨 고를 달 한 번과 이유"], ["할미의 부탁", "내가 쥘 수 있는 할 일"], ["공략서 서랍", "성격 · 일과 돈 · 사람 · 열두 달"]];

    <h1>내년에 궁금한 거 하나,<br>할미가 사주로 답해 준단다</h1><p class="sub">될지 안 될지, 왜 그런지, 언제인지를 편지 한 통으로 받아요.</p>
    <div class="lockbox"><h2>편지에 담기는 것</h2><ul>${LETTER_HAS.map(([t, d]) => `<li>${t}<span>${d}</span></li>`).join("")}</ul></div>
    <div class="price"><span>편지 한 통</span><b>${won(myPrice())}</b></div>
    <p class="cap" style="margin-top:24px">시험 중인 서비스예요. 사주는 판단 재료이고, 결정은 내가 해요.</p></div>
    ${cta("운세 보기")}`, () => { g("go").onclick = startTap; });

/* ---------- ② 나 ---------- */
function opts(from, to, suffix, sel) { let h = ""; for (let i = from; i <= to; i++) h += `<option value="${i}"${i === sel ? " selected" : ""}>${i}${suffix}</option>`; return h; }
function meScreen(err) {
  const v = { name: "", calendar: "solar", leap: false, y: 1995, m: 1, d: 1, timeKnown: true, hour: 12, minute: 0, gender: "", ...(S.me || {}) };
  const yrs = []; for (let y = 2010; y >= 1930; y--) yrs.push(`<option value="${y}"${y === +v.y ? " selected" : ""}>${y}년</option>`);
  show("me", `${head(2)}
    <h1>나를 알려 주렴</h1><p class="sub">이름과 태어난 날로 네 그림을 그려요.</p>
    <label class="f" for="name" style="margin-top:0">할미가 부를 이름</label>
    <input id="name" maxlength="12" placeholder="예: 하윤" value="${esc(v.name)}" autocomplete="off">
    <label class="f">태어난 날</label>
    <div class="seg" id="cal"><button data-v="solar">양력</button><button data-v="lunar">음력</button></div>
    <label class="check" id="leapw" style="display:none"><input type="checkbox" id="leap"> 윤달이에요</label>
    <div class="row" style="margin-top:8px"><select id="y" aria-label="년">${yrs.join("")}</select><select id="m" aria-label="월">${opts(1, 12, "월", +v.m)}</select><select id="d" aria-label="일">${opts(1, 31, "일", +v.d)}</select></div>
    <label class="f">태어난 시간</label>
    <div class="row" id="hrow"><select id="hh" aria-label="시">${opts(0, 23, "시", +v.hour)}</select><select id="mi" aria-label="분">${opts(0, 59, "분", +v.minute)}</select></div>
    <label class="check"><input type="checkbox" id="unk"> 시간은 몰라요</label>
    <label class="f">성별</label>
    <div class="seg" id="gen"><button data-v="f">여자</button><button data-v="m">남자</button></div>
    <div class="err" id="err">${esc(err || "")}</div>
    ${cta("다음")}`, () => {
    const st = { calendar: v.calendar, gender: v.gender };
    const sync = (id, key) => { [...g(id).children].forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.v === st[key]))); };
    sync("cal", "calendar"); sync("gen", "gender");
    g("cal").onclick = (e) => { const b = e.target.closest("button"); if (!b) return; st.calendar = b.dataset.v; sync("cal", "calendar"); g("leapw").style.display = st.calendar === "lunar" ? "flex" : "none"; };
    g("leapw").style.display = st.calendar === "lunar" ? "flex" : "none"; g("leap").checked = v.leap;
    g("gen").onclick = (e) => { const b = e.target.closest("button"); if (!b) return; st.gender = b.dataset.v; sync("gen", "gender"); };
    g("unk").onchange = () => { g("hh").disabled = g("mi").disabled = g("unk").checked; };
    g("hrow").addEventListener("click", () => { if (g("unk").checked) { g("unk").checked = false; g("unk").onchange(); g("hh").focus(); } }); // 잠긴 칸을 눌러도 열린다
    g("unk").checked = !v.timeKnown; g("unk").onchange();
    g("back").onclick = () => history.back();
    g("go").onclick = () => {
      const me = { name: g("name").value.trim(), calendar: st.calendar, leap: st.calendar === "lunar" && g("leap").checked, y: +g("y").value, m: +g("m").value, d: +g("d").value, gender: st.gender };
      if (!g("unk").checked) { me.hour = +g("hh").value; me.minute = +g("mi").value; }
      me.timeKnown = me.hour !== undefined;
      const dt = new Date(me.y, me.m - 1, me.d);
      const miss = !me.name ? "부를 이름을 적어 주세요" : !me.gender ? "성별을 골라 주세요" : me.calendar === "solar" && (dt.getMonth() !== me.m - 1 || dt.getDate() !== me.d) ? "그 날짜는 달력에 없어요. 다시 확인해 주세요" : "";
      if (miss) { g("err").textContent = miss; return; }
      S.me = me; LS.set("halmi_me", me); track("me");
      qScreen();
    };
  });
}

/* ---------- ③ 고민(맨 끝) ---------- */
function qScreen(prefill) {
  if (!S.me) return meScreen();
  const draft = prefill ?? LS.get("halmi_draft") ?? "";
  show("q", `${head(3)}
    <h1>고민 하나를 털어놓아 보렴</h1><p class="sub">길게, 있는 그대로 써 줄수록 할미가 정확히 짚어요.</p>
    <textarea id="q" class="big" maxlength="1200" aria-label="내 고민" placeholder="지금 상황, 바라는 것,&#10;마음에 걸리는 것을 적어 주세요">${esc(draft)}</textarea>
    <div class="cnt cap"><span id="hint"></span><span id="cnt">0 / 1200</span></div>
    <label class="f">이런 고민도 많이 와요</label>
    <div class="ex" id="ex">${EXAMPLES.map(([t, b], i) => `<button data-i="${i}" aria-pressed="false"><b>${esc(t)}</b><span>${esc(b)}</span></button>`).join("")}</div>
    <div class="err" id="err"></div>
    <p class="cap" style="margin-top:24px">시험 중인 서비스예요. 풀이는 판단 재료이고, 결정은 내가 해요.</p>
    ${cta("털어놓기")}`, () => {
    const q = g("q");
    const mark = () => { [...g("ex").children].forEach((b) => b.setAttribute("aria-pressed", String(q.value === EXAMPLES[+b.dataset.i][1]))); };
    const grow = () => { q.style.height = "auto"; q.style.height = Math.min(q.scrollHeight + 2, window.innerHeight * 0.5) + "px"; const n = q.value.length; g("cnt").textContent = `${n} / 1200`; g("hint").textContent = n === 0 ? "3줄 이상 쓰면 더 정확해요" : n < 60 ? "조금만 더 자세히 써 주세요" : "좋아요, 충분해요"; LS.set("halmi_draft", q.value); mark(); };
    q.oninput = grow; grow();
    const fill = (i) => { q.value = EXAMPLES[i][1]; grow(); q.focus(); q.setSelectionRange(q.value.length, q.value.length); toast("내 상황에 맞게 고쳐 써 보세요"); };
    g("ex").onclick = async (e) => {
      const b = e.target.closest("button"); if (!b) return; const i = +b.dataset.i;
      if (q.value.trim() === "" ) return fill(i);
      if (q.value === EXAMPLES[i][1]) return;
      if (await sheet({ title: "쓴 내용을 이 예시로 바꿀까요?", body: "바꾸면 지금 쓴 내용이 사라져요.", ok: "바꾸기", no: "그대로 둘게요" })) fill(i);
    };
    g("back").onclick = () => history.back();
    g("go").onclick = () => {
      const question = q.value.trim();
      if (question.length < 2) { g("err").textContent = "고민을 한 줄이라도 적어 주세요"; q.focus(); return; }
      track("q");
      const inp = { ...S.me, question };
      VAR === "a" ? buyScreen(inp) : startReading(inp);
    };
  });
}

/* ---------- 편지 쓰는 중 ---------- */
function stepsHtml() { return `<ul class="steps">${STAGES.slice(0, 3).map((t, i) => `<li class="${S.stage === i + 1 ? "on" : S.stage > i + 1 ? "done" : ""}">${S.stage > i + 1 ? "✓ " : ""}${t}</li>`).join("")}</ul>`; }
function waitPaint() { const s = g("steps"); if (s) s.innerHTML = S.stage === 4 ? `<div class="stage"><span class="dot"></span>${STAGES[3]}</div>` : stepsHtml(); const p = g("pic"); if (p && S.viz && !p.innerHTML) p.innerHTML = pictureHtml(); }
async function startReading(inp, tries = 0) {
  const run = ++S.run; S.u = null; S.input = inp; S.text = ""; S.viz = null; S.picks = null; S.tags = null; S.stage = 1; S.id = null; S.unlocked = false;
  show("read", `<h1>할미가 편지를 쓰고 있단다</h1><p class="sub">보통 1분 안팎 걸려요. 기다리는 동안 네 그림부터 보여 줄게요.</p><div id="steps"></div><div id="pic"></div><div class="cta"><div><button class="link" id="cancel">그만두고 돌아가기</button></div></div>`, () => { g("cancel").onclick = () => { S.run++; history.back(); }; waitPaint(); });
  let r;
  try { r = await call({ action: "read", ...inp, ab: { uid: UID, variant: VAR }, test: IS_TEST }); } catch { if (run !== S.run) return; return offlineScreen(() => startReading(inp, 0), "편지 쓰기"); }
  if (run !== S.run) return drain(r);
  if (r.status === 422) return safetyScreen();
  if (r.status === 401) return gateScreen();
  if (r.status === 409) { if (tries > 20) return failScreen(inp); await new Promise((s) => setTimeout(s, 6000)); if (run !== S.run) return; return startReading(inp, tries + 1); }
  if (r.status === 429) return limitScreen();
  if (r.status === 400) { const e = await r.json().catch(() => ({})); return meScreen(e.error === "birth_invalid" ? "그 날짜는 달력에 없어요. 날짜를 다시 확인해 주세요" : "입력을 다시 확인해 주세요"); }
  if (!r.ok || !r.body) return failScreen(inp);
  let done = false;
  try {
    const rd = r.body.getReader(), dec = new TextDecoder(); let buf = "";
    for (;;) {
      const { value, done: d } = await rd.read(); if (d) break;
      buf += dec.decode(value, { stream: true });
      let i; while ((i = buf.indexOf("\n\n")) >= 0) { const chunk = buf.slice(0, i); buf = buf.slice(i + 2); const line = chunk.split("\n").find((l) => l.startsWith("data: ")); if (!line) continue; if (handle(JSON.parse(line.slice(6)), run)) done = true; }
    }
  } catch { if (!done) { if (run !== S.run) return; return offlineScreen(() => startReading(inp, 0), "편지 쓰기"); } }
  if (!done && run === S.run) return failScreen(inp);
}
async function drain(r) { try { if (r.body) { const rd = r.body.getReader(); while (!(await rd.read()).done); } } catch {} } // 떠난 뒤에도 서버가 끝까지 쓰도록 읽어 둔다
function handle(ev, run) {
  const live = run === S.run;
  if (ev.type === "final") {
    remember(ev.id); LS.set("halmi_draft", ""); if (!live) return true;
    S.text = ev.text; S.id = ev.id; S.picks = ev.picks; S.tags = ev.tags || null; S.u = ev.u || null; S.again = true;
    track("letter", { reading_id: ev.id });
    if (VAR === "a") { // 결제(가짜)를 지나 왔으니 전체 공개. 결제 기록은 편지에도 남긴다(B와 같은 자리).
      S.unlocked = true; LS.set("halmi_unlocked", [...new Set([...unlockedIds(), ev.id])]);
      logPw(ev.id, {}).then(() => logPw(ev.id, S.paid === "skip" ? { skipped: true } : { clicked: true }));
      track("full", { reading_id: ev.id });
    }
    resultScreen(false); return true;
  }
  if (!live) return false;
  if (ev.type === "card") { S.viz = ev.viz; waitPaint(); }
  else if (ev.type === "stage") { S.stage = ev.n; waitPaint(); }
  else if (ev.type === "reset") { S.text = ""; }
  else if (ev.type === "delta") { S.text += ev.text; }
  else if (ev.type === "error") { throw new Error("gen"); }
  return false;
}
function failScreen(inp) {
  show("fail", `<div class="center"><h1>편지를 끝까지 못 썼어요</h1><p class="sub">잠깐 문제가 있었어요. 입력한 내용은 그대로예요.<br>다시 시도하면 처음부터 새로 써 드려요.</p></div>${cta("다시 써 달라고 하기", "retry", `<button class="link" id="back">고민으로 돌아가기</button>`)}`, () => { g("retry").onclick = () => startReading(inp, 0); g("back").onclick = () => qScreen(inp.question); });
}
function limitScreen() {
  const last = ids()[0];
  show("limit", `<div class="center"><h1>오늘 쓸 수 있는 편지를 다 썼어요</h1><p class="sub">하루에 쓸 수 있는 편지 수가 정해져 있어요.<br>내일 다시 와 주세요.</p></div>${cta(last ? "지난 편지 다시 보기" : "처음으로", "go")}`, () => { g("go").onclick = () => (last ? restore(last) : home()); });
}
async function restore(id) {
  show("read", `<h1>편지를 꺼내 오는 중이에요</h1><div class="cta"><div><button class="link" id="cancel">돌아가기</button></div></div>`, () => { g("cancel").onclick = () => home(); });
  let r; try { r = await call({ action: "get", id }); } catch { return offlineScreen(() => restore(id), "지난 편지"); }
  if (!r.ok) { LS.set("halmi_ids", ids().filter((x) => x !== id)); toast("지난 편지를 찾지 못했어요"); return home(); }
  const j = await r.json(); S.id = j.id; S.text = j.text; S.viz = j.chart; S.picks = j.picks; S.tags = j.tags || null; S.u = j.chart?.u || null; S.input = { question: j.question };
  const pw = j.chart?.paywall; S.price = pw?.price || S.price;
  S.unlocked = unlockedIds().includes(j.id) || j.chart?.ab?.variant === "a" || !pw || !!(pw.clicked || pw.skipped); // 옛 편지(기록 없음)·A(결제 먼저)는 다 보여 준다
  resultScreen(!!j.rated);
}

/* ---------- 그림(오행)·달력 ---------- */
function pictureHtml() {
  const z = S.viz; if (!z) return "";
  const mx = Math.max(1, ...Object.values(z.count));
  const bars = EL_ORDER.map(([h, k]) => `<div class="bar ${k === z.dmWxKo ? "me" : ""} ${z.count[h] === 0 ? "zero" : ""}"><span>${h} ${k}</span><div class="t"><i style="width:${(z.count[h] / mx) * 100}%"></i></div><b>${z.count[h]}</b></div>`).join("");
  const miss = z.missing.length ? `비어 있는 기운은 ${z.missing.map((h) => { const k = EL_ORDER.find((e) => e[0] === h); return k ? `${k[1]}(${h})` : h; }).join(", ")}이에요.` : "비어 있는 기운은 없어요.";
  return `<div class="viz"><h3>네 중심 기운은 ${z.dmWxKo}(${z.dm})이란다</h3><p class="cap">${miss} 점선은 한 글자도 없는 기운이에요.</p><div class="bars">${bars}</div></div>`;
}
function sewunHtml() {
  const z = S.viz; if (!z) return ""; const rel = z.sewun.rel;
  return `<div class="viz" style="margin-bottom:20px"><h3>2027년 丁未가 내 그림에 들어오면</h3><p class="cap">파란 칩은 어울려 묶이는 만남, 진한 칩은 부딪히는 만남이에요.</p><div class="gz">${z.pillars.map((p) => `<div>${p.gz}<small>${p.label}</small></div>`).join("")}<div class="sew">丁未<small>2027</small></div></div>${rel.length ? rel.map((r) => `<span class="pill ${r.kind}">${esc(r.short)} · ${esc(r.where)}</span>`).join("") : `<span class="cap">명식과 직접 합·충은 없어요</span>`}</div>`;
}
function calHtml(open) {
  const z = S.viz, p = S.picks; const nOpp = p?.opp?.length || 2, nRest = p?.rest?.length || 1;
  if (!open || !z || !p) return `<div class="viz"><h3>기회의 달 ${nOpp}번 · 숨 고를 달 ${nRest}번</h3><p class="cap">몇 월인지는 복주머니를 열면 알려 드려요.</p><div class="hid">${[...Array(nOpp)].map(() => `<div><b>?월</b>기회의 달</div>`).join("")}${[...Array(nRest)].map(() => `<div><b>?월</b>숨 고를 달</div>`).join("")}</div></div>`;
  const num = (l) => (l === "2028년 1월" ? 1 : parseInt(l));
  const mons = z.months.map((m, i) => { const n = num(m.label); const c = p.opp.includes(n) ? "opp" : p.rest.includes(n) ? "rest" : ""; return `<div class="mo ${c}"><b>${n}월</b>${i === 11 ? "2028" : ""}${m.ganzhi}</div>`; });
  return `<div class="viz"><h3>내 질문의 달력</h3><p class="cap">할미가 고른 달이에요. 달 경계는 절기 시각 기준이에요.</p><div class="months">${mons.join("")}</div><div class="legend"><span><i style="background:var(--primary)"></i>기회의 달</span><span><i style="border:2px solid var(--g800)"></i>숨 고를 달</span></div></div>`;
}

/* ---------- 편지 읽기(분해) ---------- */
const MROW = /^(?:2028년\s*)?(\d{1,2})월\s*[·ㆍ]\s*(.+?)\s*[·ㆍ]\s*(.+)$/;
function paraHtml(t, i, k) {
  const m = t.match(MROW) || (/^(?:2028년\s*)?\d{1,2}월\s*[·ㆍ]/.test(t) ? t.match(/^(?:2028년\s*)?(\d{1,2})월\s*[·ㆍ]\s*(.+?)(?:,\s*(.+))?$/) : null);
  if (m) return `<div class="mrow"><b>${m[1]}월</b><div><p>${esc(m[2])}</p>${m[3] ? `<small>${esc(m[3])}</small>` : ""}</div></div>`;
  return /^—\s*할미가/.test(t) ? `<p class="sign">${esc(t)}</p>` : `<p${i === 0 && k === 0 && /^사랑하는/.test(t) ? ' class="name"' : ""}>${esc(t)}</p>`;
}
function parseLetter(text) {
  const raw = text.replace(/\[\[[^\]]*$/, "").replace(/\[\[[^\]]*\]\]/g, "");
  const cut = raw.indexOf("=== 서랍 ===");
  const main = cut >= 0 ? raw.slice(0, cut) : raw, drawer = cut >= 0 ? raw.slice(cut + 12) : "";
  const secs = [{ h: null, p: [] }];
  for (const l of main.split("\n")) { if (/^##\s+/.test(l)) secs.push({ h: l.replace(/^##\s+/, "").trim(), p: [] }); else if (l.trim()) secs[secs.length - 1].p.push(l.trim()); }
  let opening = secs[0].p.filter((l) => !/^사랑하는/.test(l)), rest = secs.slice(1);
  if (!rest.length && opening.length > 1) { rest = [{ h: "할미가 해 주는 이야기", p: opening.slice(1) }]; opening = [opening[0]]; } // 소제목 형식이 깨졌을 때
  return { opening, secs: rest, drawer };
}
const sents = (t) => t.split(/(?<=[.?!])\s+/).map((s) => s.trim()).filter(Boolean);
function toneOf() {
  const sens = S.u && ["health", "legal", "invest"].includes(S.u.sensitive), v = S.tags?.verdict;
  if (sens || v === "정리") return "할미가 정리해 봤단다";
  if (v === "조심") return "쉽진 않지만 열리는 길이 하나 있단다";
  return "할미의 판정";
}

/* ---------- ⑤ 세뱃돈(무료) · ⑥ 결제 선 · ⑦ 전체 · ⑧ 다음 ---------- */
function resultScreen(rated) {
  if (rated !== undefined) S.rated = rated; else rated = S.rated;
  const L = parseLetter(S.text), open = S.unlocked;
  const vs = sents(L.opening.length ? L.opening.join(" ") : (L.secs[0]?.p[0] || ""));
  const verdict = vs.slice(0, 2).join(" "), extraOpen = vs.slice(2).join(" "); // 판정은 두 문장까지만, 넘치는 말은 전체 공개 때 이어서 보여 준다
  const twist = S.tags?.twist || "";
  const r1 = L.secs[0], rest = L.secs.slice(1);
  let iSew = rest.findIndex((s) => /2027|정미|내년|올해|이 해/.test(s.h || ""));
  // 첫 이유 단락: 앞부분만 보이고 뒤는 흐리게
  let previewHtml = "", blurHtml = "";
  if (r1) {
    const ss = sents(r1.p.join(" ")); let shown = [], n = 0;
    for (const s of ss) { if (n >= 120 && shown.length >= 2) break; shown.push(s); n += s.length; }
    const hid = ss.slice(shown.length);
    previewHtml = `<p>${esc(shown.join(" "))}</p>`;
    blurHtml = hid.length ? `<div class="blur" aria-hidden="true"><p>${esc(hid.join(" "))}</p></div>` : "";
  }
  const toc = L.secs.length ? `<div class="toc"><h2>할미가 풀어 준 이야기</h2><ol>${L.secs.map((s, i) => `<li><b>${i + 1}</b><span>${esc(s.h)}</span></li>`).join("")}</ol></div>` : "";
  const fullSec = (s, i, k) => `${k === iSew ? sewunHtml() : ""}<div class="sec letter"><h2 class="lh">${esc(s.h)}</h2>${s.p.map((t, kk) => paraHtml(t, 9, kk)).join("")}</div>`;
  let body;
  if (open) {
    const r1full = r1 ? `<div class="sec letter"><h2 class="lh">${esc(r1.h)}</h2>${r1.p.map((t, kk) => paraHtml(t, 9, kk)).join("")}</div>` : "";
    let dr = "";
    if (L.drawer.trim()) {
      const blocks = L.drawer.split(/^#{2,3}\s+/m).map((x) => x.trim()).filter(Boolean);
      dr = `<div class="sec"><h2 class="lh">내 공략서 서랍</h2><p class="cap">궁금한 칸만 열어 보세요.</p>` + blocks.map((b) => { const [title, ...rs] = b.split("\n"); return `<details class="fold"><summary>${esc(title.split("—")[0].trim())}</summary><div class="dr">${rs.join("\n").split(/\n+/).map((x) => x.trim()).filter(Boolean).map((x) => paraHtml(x, 9, 9)).join("")}</div></details>`; }).join("") + `</div>`;
    }
    body = `${extraOpen ? `<div class="letter"><p>${esc(extraOpen)}</p></div>` : ""}${r1full}${calHtml(true)}${twist ? twistHtml(twist) : ""}${rest.map((s, k) => fullSec(s, 0, k)).join("")}${dr}`;
  } else {
    body = `${r1 ? `<div class="sec letter"><h2 class="lh">${esc(r1.h)}</h2>${previewHtml}${blurHtml}</div>` : ""}${calHtml(false)}${twist ? twistHtml(twist) : ""}
      <div class="lockbox"><h2>여기서부터는 복주머니에 담아 뒀단다</h2><ul><li>이야기 전부<span>네 그림이 왜 그런지, 2027년이 무엇을 바꾸는지</span></li><li>달마다 이유<span>기회의 달·숨 고를 달이 몇 월인지와 이유</span></li><li>할미의 부탁<span>네가 쥘 수 있는 할 일</span></li><li>공략서 서랍<span>성격 · 일과 돈 · 사람 · 열두 달</span></li></ul><p class="cap">시험 중인 서비스예요.</p></div>`;
  }
  const table = open && S.viz ? `<details class="fold"><summary>할미가 본 내 사주</summary><table class="t2"><tr><th></th>${S.viz.pillars.map((p) => `<th>${p.label}주</th>`).join("")}</tr><tr><th>글자</th>${S.viz.pillars.map((p) => `<td>${p.gz}</td>`).join("")}</tr></table><p class="cap">일간 ${S.viz.dm}(${S.viz.dmWxKo})${S.viz.timeKnown ? "" : " · 태어난 시간을 몰라 시주는 뺐어요"}</p></details>` : "";
  const pv = prevId();
  const next = open ? `<div class="rows">${pv ? `<button class="rowbtn" id="prev"><div><b>지난번에 받은 편지가 있어요</b><span>다시 보기</span></div>${CHEV_R}</button>` : ""}<button class="rowbtn" id="other"><div><b>다른 질문 하기</b><span>새 고민으로 편지 받기</span></div>${CHEV_R}</button></div><p class="cap">사주는 판단 재료예요. 결정은 내가 해요.</p>` : "";
  const bar = open ? (rated ? "" : cta("편지 어땠는지 알려 주기", "go")) : cta(`복주머니 열기 · ${won(myPrice())}`, "go", `<button class="link" id="skip">그냥 다 보기</button>`);
  show("result", `<div class="res">
      <div class="vd"><p class="cap">${esc(toneOf())}</p><p class="t">${esc(verdict)}</p></div>
      <div id="pic">${pictureHtml()}</div>
      ${toc}${body}${table}${next}</div>${bar}`, () => {
    if (!open) {
      if (S.id && !LS.get("halmi_shown_" + S.id)) { LS.set("halmi_shown_" + S.id, 1); logPw(S.id, {}); track("pay_view", { reading_id: S.id }); }
      g("go").onclick = () => unlock("click"); g("skip").onclick = () => unlock("skip");
    } else {
      if (g("go")) g("go").onclick = () => evalScreen();
      if (g("other")) g("other").onclick = () => { S.again = true; qScreen(""); };
      if (g("prev")) g("prev").onclick = () => restore(pv);
    }
  });
}
const twistHtml = (t) => `<div class="twist"><p class="cap">의외의 다시 보기</p><p class="t">${esc(t)}</p></div>`;
async function unlock(kind) {
  const id = S.id;
  track(kind === "click" ? "pay_click" : "pay_skip", { reading_id: id });
  if (kind === "click") { logPw(id, { clicked: true }); await sheet({ title: "아직 결제는 준비 중이에요", body: "이번엔 다 보여 줄게요.", ok: "다 보기" }); }
  else logPw(id, { skipped: true });
  S.unlocked = true; LS.set("halmi_unlocked", [...new Set([...unlockedIds(), id])]); track("full", { reading_id: id });
  S.popping = true; resultScreen(false); S.popping = false;
  window.scrollTo(0, 0);
}

/* ---------- 평가 ---------- */
const QS = [["fun", "읽는 게 재밌었나요?"], ["me", "내 얘기 같았나요?"], ["help", "도움이 됐나요?"], ["heard", "할미가 내 마음을 알아준 것 같았나요?"]];
function sentences() { return S.text.split("=== 서랍 ===")[0].split(/\n/).filter((l) => !/^##|^—|^사랑하는/.test(l.trim())).join(" ").split(/(?<=[.?!])\s+/).map((s) => s.trim()).filter((s) => s.length >= 14 && s.length <= 90); }
function evalScreen() {
  S.rating = {}; S.resonant = ""; S.feedback = "";
  const ss = sentences();
  show("eval", `<h1>편지는 어땠나요?</h1><p class="sub">솔직하게 눌러 주세요. 편지를 더 좋게 만드는 데만 써요.</p>
    ${QS.map(([k, t]) => `<div class="qitem"><p>${t}</p><div class="scale" data-k="${k}">${[1, 2, 3, 4, 5].map((n) => `<button data-n="${n}" aria-pressed="false">${n}</button>`).join("")}</div><div class="cap"><span>전혀</span><span>매우</span></div></div>`).join("")}
    <div class="qitem"><p>한 줄로 남기고 싶은 말이 있나요? <span class="cap">(선택)</span></p><textarea id="fb" maxlength="300" placeholder="좋았던 점, 아쉬웠던 점 아무거나요"></textarea></div>
    <div class="qitem"><p>가장 와닿은 문장을 골라 주세요 <span class="cap">(선택)</span></p>${ss.slice(0, 14).map((s, i) => `<button class="sent" data-i="${i}" aria-pressed="false">${esc(s)}</button>`).join("")}</div>
    ${cta("보내기", "go", `<button class="link" id="back">편지로 돌아가기</button>`)}`, () => {
    const go = g("go"); const upd = () => (go.disabled = !QS.every(([k]) => S.rating[k])); upd();
    document.querySelectorAll(".scale").forEach((sc) => (sc.onclick = (e) => { const b = e.target.closest("button"); if (!b) return; S.rating[sc.dataset.k] = +b.dataset.n; [...sc.children].forEach((c) => c.setAttribute("aria-pressed", String(c === b))); upd(); }));
    document.querySelectorAll(".sent").forEach((b) => (b.onclick = () => { const on = b.getAttribute("aria-pressed") !== "true"; document.querySelectorAll(".sent").forEach((x) => x.setAttribute("aria-pressed", "false")); b.setAttribute("aria-pressed", String(on)); S.resonant = on ? ss[+b.dataset.i] : ""; }));
    g("back").onclick = () => history.back();
    go.onclick = async () => {
      go.disabled = true; go.textContent = "보내는 중이에요";
      try {
        const r = await call({ action: "rate", id: S.id, ...S.rating, feedback: g("fb").value.trim(), resonant: S.resonant });
        if (!r.ok) throw 0; S.rated = true; track("rate", { reading_id: S.id }); doneScreen();
      } catch { go.disabled = false; go.textContent = "보내기"; toast("전송이 안 됐어요. 연결을 확인하고 다시 눌러 주세요"); }
    };
  });
}
function doneScreen() {
  show("done", `<div class="center"><h1>알려 줘서 고마워요</h1><p class="sub">남겨 준 점수는 편지를 더 좋게 다듬는 데 써요.</p></div>${cta("다른 질문 하기", "go", `<button class="link" id="view">편지 다시 보기</button>`)}`, () => { g("go").onclick = () => { S.again = true; qScreen(""); }; g("view").onclick = () => { S.popping = true; resultScreen(true); S.popping = false; }; });
}
window.addEventListener("offline", () => toast("인터넷이 끊겼어요"));
boot();
</script>
</body>
</html>
